<button (click)="onClick()" [class]="'h-[22px] rounded-[16px] transition-all whitespace-nowrap font-jakarta ' +
    (active
      ? 'bg-[#5732EE] text-white border-none font-medium'
      : 'bg-white text-[#382098] border-[0.5px] border-[#382098] font-normal')"
    style="font-size: clamp(9px, 2.5vw, 12px); padding: 0 clamp(8px, 2.5vw, 14px);">{{ label }}</button>

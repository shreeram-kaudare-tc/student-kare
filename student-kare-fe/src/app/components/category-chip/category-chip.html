<button (click)="onClick()" [class]="'h-[22px] rounded-[16px] font-normal leading-[100%] transition-all whitespace-nowrap font-jakarta ' +
    (active
      ? 'bg-[#5732EE] text-white border-none'
      : 'bg-[#ffffff] text-[#5732EE] border-[0.5px] border-[#5732EE]')"
    style="font-size: clamp(9px, 2.4vw, 11px); padding: 0 clamp(4px, 2vw, 10px);">{{ label }}</button>

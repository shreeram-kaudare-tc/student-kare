<div class="flex items-center gap-2 bg-white border border-gray-200 rounded-2xl px-4 py-2.5 focus-within:ring-2 focus-within:ring-orange-300 focus-within:border-orange-400 transition">
  <svg class="w-5 h-5 text-gray-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
  </svg>
  <input
    type="text"
    [(ngModel)]="query"
    [placeholder]="placeholder"
    (input)="onSearch()"
    class="flex-1 bg-transparent text-sm text-gray-800 placeholder-gray-400 focus:outline-none"
  />
  @if (query) {
    <button (click)="onClear()" class="text-gray-300 hover:text-gray-500 transition">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
    </button>
  }
</div>

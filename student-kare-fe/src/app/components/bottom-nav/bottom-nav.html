<div class="bottom-nav-container">
  @for (item of navItems; track item.route) {
  <button (click)="router.navigate([item.route])" class="nav-item" [class.active]="isActive(item.route)">

    <!-- Home Icon -->
    @if (item.icon === 'home') {
      @if (isActive(item.route)) {
        <img src="images/nav/home-filled.svg" alt="Home" />
      } @else {
        <img src="images/nav/home-outline.svg" alt="Home" />
      }
    }

    <!-- Categories Icon -->
    @if (item.icon === 'shop') {
      <img src="images/nav/category-outline.svg" alt="Categories" />
    }

    <!-- Cart Icon -->
    @if (item.icon === 'cart') {
      @if (isActive(item.route)) {
        <img src="images/nav/cart-filled.svg" alt="Cart" />
      } @else {
        <img src="images/nav/cart-outline.svg" alt="Cart" />
      }
    }

    <!-- Orders Icon -->
    @if (item.icon === 'orders') {
      @if (isActive(item.route)) {
        <img src="images/nav/orders-filled.svg" alt="Orders" />
      } @else {
        <img src="images/nav/orders-outline.svg" alt="Orders" />
      }
    }

    <div class="active-indicator" [class.visible]="isActive(item.route)"></div>

    <span class="nav-label">
      {{ item.label }}
    </span>
  </button>
  }
</div>

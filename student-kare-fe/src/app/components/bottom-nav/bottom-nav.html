<nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 z-50">
  <div class="flex items-center justify-around h-16 max-w-lg mx-auto">
    @for (item of navItems; track item.route) {
      <button
        (click)="router.navigate([item.route])"
        [class]="'flex flex-col items-center gap-0.5 flex-1 py-2 transition-colors ' + (isActive(item.route) ? 'text-orange-500' : 'text-gray-400 hover:text-gray-600')"
      >
        @if (item.icon === 'home') {
          <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
        }
        @if (item.icon === 'shop') {
          <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" /></svg>
        }
        @if (item.icon === 'cart') {
          <div class="relative">
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
            @if (cartCount > 0) {
              <span class="absolute -top-1 -right-2 w-4 h-4 bg-orange-500 text-white text-xs font-bold rounded-full flex items-center justify-center">{{ cartCount }}</span>
            }
          </div>
        }
        @if (item.icon === 'orders') {
          <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" /></svg>
        }
        <span class="text-xs font-medium">{{ item.label }}</span>
      </button>
    }
  </div>
</nav>

<div class="bottom-nav-container">
  @for (item of navItems; track item.route) {
  <button (click)="router.navigate([item.route])" class="nav-item">
    
    <!-- Home Icon -->
    @if (item.icon === 'home') {
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 21V9L12 3L20 9V21H14V14H10V21H4Z" [attr.stroke]="isActive(item.route) ? '#5732EE' : '#A3ADC2'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    }

    <!-- Categories Icon (2x2 grid) -->
    @if (item.icon === 'shop') {
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M2.5 2.5H8.33333V8.33333H2.5V2.5Z" [attr.stroke]="isActive(item.route) ? '#5732EE' : '#A3ADC2'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M11.6667 2.5H17.5V8.33333H11.6667V2.5Z" [attr.stroke]="isActive(item.route) ? '#5732EE' : '#A3ADC2'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M2.5 11.6667H8.33333V17.5H2.5V11.6667Z" [attr.stroke]="isActive(item.route) ? '#5732EE' : '#A3ADC2'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M11.6667 11.6667H17.5V17.5H11.6667V11.6667Z" [attr.stroke]="isActive(item.route) ? '#5732EE' : '#A3ADC2'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    }

    <!-- Cart Icon -->
    @if (item.icon === 'cart') {
    <div class="relative flex flex-col items-center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M1 1H4.27273L6.23636 11.5273C6.30545 11.9 6.50545 12.2273 6.8 12.4545C7.09455 12.6818 7.45455 12.8 7.82727 12.8H18.9091C19.2818 12.8 19.6418 12.6818 19.9364 12.4545C20.2309 12.2273 20.4309 11.9 20.5 11.5273L21.8182 4.63636H5.27273" [attr.stroke]="isActive(item.route) ? '#5732EE' : '#A3ADC2'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="9" cy="19" r="2" [attr.stroke]="isActive(item.route) ? '#5732EE' : '#A3ADC2'" stroke-width="1.8" />
        <circle cx="18" cy="19" r="2" [attr.stroke]="isActive(item.route) ? '#5732EE' : '#A3ADC2'" stroke-width="1.8" />
      </svg>
      @if (cartCount > 0) {
        <span class="absolute -top-[2px] -right-[5px] bg-[#EE4D4D] text-white text-[9px] font-bold rounded-full w-4 h-4 flex items-center justify-center border-2 border-white shadow-sm">{{ cartCount }}</span>
      }
    </div>
    }

    <!-- Orders Icon (Isometric Box) -->
    @if (item.icon === 'orders') {
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 21L21 16.5V7.5L12 3L3 7.5V16.5L12 21Z" [attr.stroke]="isActive(item.route) ? '#5732EE' : '#A3ADC2'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M12 12V21M12 12L21 7.5M12 12L3 7.5" [attr.stroke]="isActive(item.route) ? '#5732EE' : '#A3ADC2'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M7.5 5.25L16.5 9.75" [attr.stroke]="isActive(item.route) ? '#5732EE' : '#A3ADC2'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    }

    <span class="nav-label" [style.color]="isActive(item.route) ? '#5732EE' : '#8C9099'">
      {{ item.label }}
    </span>
  </button>
  }
</div>

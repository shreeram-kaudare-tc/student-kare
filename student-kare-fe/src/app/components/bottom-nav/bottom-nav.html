<svg style="width:0;height:0;position:absolute;" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="activeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3E63DD" />
      <stop offset="100%" style="stop-color:#9A84F5" />
    </linearGradient>
  </defs>
</svg>

<div class="bottom-nav-container">
  @for (item of navItems; track item.route) {
  <button (click)="router.navigate([item.route])" class="nav-item" [class.active]="isActive(item.route)">

    <!-- Home Icon -->
    @if (item.icon === 'home') {
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4.5 10.5L12 3L19.5 10.5V19.5C19.5 20.3284 18.8284 21 18 21H15V14H9V21H6C5.17157 21 4.5 20.3284 4.5 19.5V10.5Z" 
        [attr.fill]="isActive(item.route) ? 'url(#activeGradient)' : 'none'" 
        [attr.stroke]="isActive(item.route) ? 'url(#activeGradient)' : '#5732EE'" 
        stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    }

    <!-- Categories Icon (2x2 grid) -->
    @if (item.icon === 'shop') {
    <svg width="22" height="22" viewBox="0 0 25 25" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 4H10.9545V10.9545H4V4ZM4 14.0455H10.9545V21H4V14.0455ZM14.0455 14.0455H21V21H14.0455V14.0455ZM14.0455 4H21V10.9545H14.0455V4Z" 
        [attr.fill]="isActive(item.route) ? 'url(#activeGradient)' : 'none'" 
        [attr.stroke]="isActive(item.route) ? 'url(#activeGradient)' : '#5732EE'" 
        stroke-width="1.8" stroke-linejoin="round" />
    </svg>
    }

    <!-- Cart Icon -->
    @if (item.icon === 'cart') {
    <div class="relative flex flex-col items-center gap-[6px]">
      @if (isActive(item.route)) {
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M18 16C16.89 16 16 16.89 16 18C16 18.5304 16.2107 19.0391 16.5858 19.4142C16.9609 19.7893 17.4696 20 18 20C18.5304 20 19.0391 19.7893 19.4142 19.4142C19.7893 19.0391 20 18.5304 20 18C20 17.4696 19.7893 16.9609 19.4142 16.5858C19.0391 16.2107 18.5304 16 18 16ZM2 0V2H4L7.6 9.59L6.24 12.04C6.09 12.32 6 12.65 6 13C6 13.5304 6.21071 14.0391 6.58579 14.4142C6.96086 14.7893 7.46957 15 8 15H20V13H8.42C8.3537 13 8.29011 12.9737 8.24322 12.9268C8.19634 12.8799 8.17 12.8163 8.17 12.75C8.17 12.7 8.18 12.66 8.2 12.63L9.1 11H16.55C17.3 11 17.96 10.58 18.3 9.97L21.88 3.5C21.95 3.34 22 3.17 22 3C22 2.73478 21.8946 2.48043 21.7071 2.29289C21.5196 2.10536 21.2652 2 21 2H6.21L5.27 0M8 16C6.89 16 6 16.89 6 18C6 18.5304 6.21071 19.0391 6.58579 19.4142C6.96086 19.7893 7.46957 20 8 20C8.53043 20 9.03914 19.7893 9.41421 19.4142C9.78929 19.0391 10 18.5304 10 18C10 17.4696 9.78929 16.9609 9.41421 16.5858C9.03914 16.2107 8.53043 16 8 16Z" fill="url(#cartActiveGradient)"/>
          <line x1="0.5" y1="23.5" x2="23.5" y2="23.5" stroke="url(#lineActiveGradient)" stroke-linecap="round" stroke-width="2" />
          <defs>
            <linearGradient id="cartActiveGradient" x1="2.55556" y1="1.34328" x2="20.7329" y2="6.19333" gradientUnits="userSpaceOnUse">
              <stop stop-color="#3E63DD"/>
              <stop offset="1" stop-color="#9A84F5"/>
            </linearGradient>
            <linearGradient id="lineActiveGradient" x1="0.666667" y1="24.0672" x2="1.22291" y2="27.6291" gradientUnits="userSpaceOnUse">
              <stop stop-color="#3E63DD"/>
              <stop offset="1" stop-color="#9A84F5"/>
            </linearGradient>
          </defs>
        </svg>
      } @else {
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M17 18C17.5304 18 18.0391 18.2107 18.4142 18.5858C18.7893 18.9609 19 19.4696 19 20C19 20.5304 18.7893 21.0391 18.4142 21.4142C18.0391 21.7893 17.5304 22 17 22C16.4696 22 15.9609 21.7893 15.5858 21.4142C15.2107 21.0391 15 20.5304 15 20C15 18.89 15.89 18 17 18ZM1 2H4.27L5.21 4H20C20.2652 4 20.5196 4.10536 20.7071 4.29289C20.8946 4.48043 21 4.73478 21 5C21 5.17 20.95 5.34 20.88 5.5L17.3 11.97C16.96 12.58 16.3 13 15.55 13H8.1L7.2 14.63L7.17 14.75C7.17 14.8163 7.19634 14.8799 7.24322 14.9268C7.29011 14.9737 7.3537 15 7.42 15H19V17H7C6.46957 17 5.96086 16.7893 5.58579 16.4142C5.21071 16.0391 5 15.5304 5 15C5 14.65 5.09 14.32 5.24 14.04L6.6 11.59L3 4H1V2ZM7 18C7.53043 18 8.03914 18.2107 8.41421 18.5858C8.78929 18.9609 9 19.4696 9 20C9 20.5304 8.78929 21.0391 8.41421 21.4142C8.03914 21.7893 7.53043 22 7 22C6.46957 22 5.96086 21.7893 5.58579 21.4142C5.21071 21.0391 5 20.5304 5 20C5 18.89 5.89 18 7 18ZM16 11L18.78 6H6.14L8.5 11H16Z" fill="#5732EE"/>
        </svg>
      }
      @if (cartCount > 0) {
      <div class="absolute top-[6px] right-[2px] w-[6px] h-[6px] bg-[#E90101] rounded-full"></div>
      }
      <div class="active-indicator" [class.visible]="isActive(item.route)"></div>
    </div>
    }


    <!-- Orders Icon -->
    @if (item.icon === 'orders') {
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Main Isometric Cube Body -->
      <path d="M12 1.95L21 7.15V17.55L12 22.75L3 17.55V7.15L12 1.95Z" 
        [attr.fill]="isActive(item.route) ? 'url(#activeGradient)' : 'none'"
        [attr.stroke]="isActive(item.route) ? 'url(#activeGradient)' : '#5732EE'" 
        stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      
      <!-- Internal Facets / Structure -->
      <path d="M12 12.35V22.75" 
        [attr.stroke]="isActive(item.route) ? 'white' : '#5732EE'" 
        stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M21 7.15L12 12.35L3 7.15" 
        [attr.stroke]="isActive(item.route) ? 'white' : '#5732EE'" 
        stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
      
      <!-- Top Tape Detail (Isometric) -->
      <path d="M8.5 4.1L15.3 8.1" 
        [attr.stroke]="isActive(item.route) ? 'white' : '#5732EE'" 
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Tape vertical hang-down -->
      <path d="M12 10.35V14.35" 
        [attr.stroke]="isActive(item.route) ? 'white' : '#5732EE'" 
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      
      <!-- Side Label Detail -->
      <path d="M16 15.15H19" 
        [attr.stroke]="isActive(item.route) ? 'white' : '#5732EE'" 
        stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M16 17.15H19" 
        [attr.stroke]="isActive(item.route) ? 'white' : '#5732EE'" 
        stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    }

    <div class="active-indicator" [class.visible]="isActive(item.route)"></div>
    
    <span class="nav-label">
      {{ item.label }}
    </span>
  </button>
  }
</div>

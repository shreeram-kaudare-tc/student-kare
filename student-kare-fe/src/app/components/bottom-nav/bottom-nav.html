<div class="bottom-nav-container">
  @for (item of navItems; track item.route) {
  <button (click)="router.navigate([item.route])" class="nav-item">

    <!-- Home Icon -->
    @if (item.icon === 'home') {
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 21V9L12 3L20 9V21H14V14H10V21H4Z" [attr.stroke]="isActive(item.route) ? '#5732EE' : '#A3ADC2'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    }

    <!-- Categories Icon (2x2 grid) -->
    @if (item.icon === 'shop') {
    <svg width="25" height="25" viewBox="0 0 25 25" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 4H10.9545V10.9545H4V4ZM4 14.0455H10.9545V21H4V14.0455ZM14.0455 14.0455H21V21H14.0455V14.0455ZM14.0455 4H21V10.9545H14.0455V4Z" [attr.stroke]="isActive(item.route) ? '#5732EE' : '#A3ADC2'" stroke-linejoin="round" />
    </svg>
    }

    <!-- Cart Icon -->
    @if (item.icon === 'cart') {
    <div class="relative flex flex-col items-center">

      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M18 16C16.89 16 16 16.89 16 18C16 18.5304 16.2107 19.0391 16.5858 19.4142C16.9609 19.7893 17.4696 20 18 20C18.5304 20 19.0391 19.7893 19.4142 19.4142C19.7893 19.0391 20 18.5304 20 18C20 17.4696 19.7893 16.9609 19.4142 16.5858C19.0391 16.2107 18.5304 16 18 16ZM2 0V2H4L7.6 9.59L6.24 12.04C6.09 12.32 6 12.65 6 13C6 13.5304 6.21071 14.0391 6.58579 14.4142C6.96086 14.7893 7.46957 15 8 15H20V13H8.42C8.3537 13 8.29011 12.9737 8.24322 12.9268C8.19634 12.8799 8.17 12.8163 8.17 12.75C8.17 12.7 8.18 12.66 8.2 12.63L9.1 11H16.55C17.3 11 17.96 10.58 18.3 9.97L21.88 3.5C21.95 3.34 22 3.17 22 3C22 2.73478 21.8946 2.48043 21.7071 2.29289C21.5196 2.10536 21.2652 2 21 2H6.21L5.27 0M8 16C6.89 16 6 16.89 6 18C6 18.5304 6.21071 19.0391 6.58579 19.4142C6.96086 19.7893 7.46957 20 8 20C8.53043 20 9.03914 19.7893 9.41421 19.4142C9.78929 19.0391 10 18.5304 10 18C10 17.4696 9.78929 16.9609 9.41421 16.5858C9.03914 16.2107 8.53043 16 8 16Z"
          [attr.fill]="isActive(item.route) ? '#5732EE' : '#A3ADC2'" />

      </svg>
      @if (cartCount > 0) {
      <span class="absolute -top-[2px] -right-[5px] bg-[#EE4D4D] text-white text-[9px] font-bold rounded-full w-4 h-4 flex items-center justify-center border-2 border-white shadow-sm">{{ cartCount }}</span>
      }
    </div>
    }

    <!-- Orders Icon (Isometric Box) -->
    @if (item.icon === 'orders') {
    <svg width="19" height="19" viewBox="0 0 19 19" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path
        d="M9.07617 0.208206C9.22189 0.130947 9.39917 0.131026 9.54492 0.208206L18.249 4.79512C18.3381 4.84196 18.4029 4.91391 18.4434 4.99239L18.46 5.02852L18.4824 5.09981C18.4887 5.1265 18.4932 5.156 18.4932 5.1877V13.4426C18.4932 13.5891 18.418 13.7207 18.3008 13.8029L18.248 13.8352L9.6084 18.3918L9.60742 18.3908C9.59267 18.3988 9.58039 18.4044 9.57422 18.4064C9.57236 18.4071 9.57037 18.4081 9.56934 18.4084L9.57129 18.4074L9.57031 18.4064C9.55783 18.4119 9.54531 18.417 9.53223 18.4211L9.5332 18.4221C9.48822 18.437 9.43428 18.4504 9.375 18.4504H9.37402C9.31277 18.4504 9.25735 18.4362 9.21387 18.4221L9.21289 18.4211C9.20524 18.4186 9.18844 18.413 9.17188 18.4055L9.17676 18.4074H9.1748C9.16963 18.4057 9.15389 18.4002 9.13672 18.3908V18.3898L0.436523 13.802V13.801C0.412703 13.7886 0.395412 13.7749 0.388672 13.7688L0.384766 13.7648L0.389648 13.7688V13.7678C0.373954 13.7567 0.342405 13.7359 0.31543 13.7072L0.316406 13.7063C0.290869 13.6796 0.272805 13.6515 0.264648 13.6389C0.252836 13.6206 0.235263 13.5924 0.222656 13.5578L0.181641 13.4475L0.197266 13.4367C0.196053 13.4284 0.192383 13.4194 0.192383 13.4094V5.15352C0.192383 5.13857 0.195079 5.12584 0.197266 5.11641C0.198124 5.11275 0.198514 5.10904 0.199219 5.10664C0.203711 5.06706 0.212948 5.03148 0.224609 5.00117C0.230647 4.98496 0.237712 4.96754 0.24707 4.95039C0.2665 4.91491 0.290984 4.88096 0.320312 4.85078L0.322266 4.84883C0.334236 4.83691 0.347493 4.82448 0.364258 4.81172C0.377196 4.80162 0.403866 4.78029 0.436523 4.76289H0.4375L9.07617 0.208206ZM1.14844 13.1467L8.89551 17.2316V10.0061L5.31445 8.11836V9.74336C5.31441 10.0044 5.08715 10.1936 4.83594 10.1936H4.68555V10.1672C4.50121 10.1092 4.35756 9.95027 4.35742 9.74336V7.61348L1.14844 5.92207V13.1467ZM9.85254 10.0061V17.2316L17.5352 13.1789V5.95528L9.85254 10.0061ZM0.204102 13.4768V13.4748C0.203877 13.4741 0.203453 13.4729 0.203125 13.4719L0.204102 13.4768ZM5.81445 7.35078L9.37207 9.22578L17.0342 5.18672L13.4775 3.31172L5.81445 7.35078ZM1.64941 5.1545L4.83594 6.83418L12.499 2.7961L9.31055 1.11543L1.64941 5.1545Z"
        [attr.fill]="isActive(item.route) ? '#5732EE' : '#A3ADC2'" [attr.stroke]="isActive(item.route) ? '#5732EE' : '#A3ADC2'" stroke-width="0.3" />
      <path d="M16.6038 12.3932L14.5111 13.4964C14.3534 13.5789 14.3 13.7627 14.3912 13.9059C14.4519 14.0019 14.562 14.0559 14.6762 14.0559C14.732 14.0559 14.7887 14.0432 14.8404 14.0154L16.9331 12.9122C17.0908 12.8297 17.1442 12.6459 17.0531 12.5027C16.9627 12.3594 16.7615 12.3092 16.6046 12.3932H16.6038Z" [attr.fill]="isActive(item.route) ? '#5732EE' : '#A3ADC2'" />
      <path d="M16.6038 11.289L14.5111 12.3923C14.3534 12.4748 14.3 12.6585 14.3912 12.8018C14.4519 12.8978 14.562 12.9518 14.6762 12.9518C14.732 12.9518 14.7887 12.939 14.8404 12.9113L16.9331 11.808C17.0908 11.7255 17.1442 11.5418 17.0531 11.3985C16.9627 11.2545 16.7615 11.205 16.6046 11.289H16.6038Z" [attr.fill]="isActive(item.route) ? '#5732EE' : '#A3ADC2'" />
    </svg>
    }

    <span class="nav-label" [style.color]="isActive(item.route) ? '#5732EE' : '#8C9099'">
      {{ item.label }}
    </span>
  </button>
  }
</div>

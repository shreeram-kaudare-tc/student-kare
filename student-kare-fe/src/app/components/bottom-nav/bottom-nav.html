<div class="bottom-nav-container">
  @for (item of navItems; track item.route) {
  <button (click)="router.navigate([item.route])" class="nav-item" [class.active]="isActive(item.route)">

    <!-- Home Icon -->
    @if (item.icon === 'home') {
      @if (isActive(item.route)) {
        <img src="images/nav/home-filled.svg" alt="Home" width="24" height="22" />
      } @else {
        <img src="images/nav/home-outline.svg" alt="Home" width="24" height="24" />
      }
    }

    <!-- Categories Icon -->
    @if (item.icon === 'shop') {
      <img src="images/nav/category-outline.svg" alt="Categories" width="19" height="19" />
    }

    <!-- Cart Icon -->
    @if (item.icon === 'cart') {
    <div class="relative flex flex-col items-center">
      @if (isActive(item.route)) {
        <img src="images/nav/cart-filled.svg" alt="Cart" width="24" height="24" />
      } @else {
        <img src="images/nav/cart-outline.svg" alt="Cart" width="24" height="24" />
      }
      @if (cartCount > 0) {
      <div class="absolute top-[0px] right-[0px] w-[6px] h-[6px] bg-[#E90101] rounded-full"></div>
      }
    </div>
    }

    <!-- Orders Icon -->
    @if (item.icon === 'orders') {
      @if (isActive(item.route)) {
        <img src="images/nav/orders-filled.svg" alt="Orders" width="24" height="21" />
      } @else {
        <img src="images/nav/orders-outline.svg" alt="Orders" width="19" height="19" />
      }
    }

    <div class="active-indicator" [class.visible]="isActive(item.route)"></div>

    <span class="nav-label">
      {{ item.label }}
    </span>
  </button>
  }
</div>

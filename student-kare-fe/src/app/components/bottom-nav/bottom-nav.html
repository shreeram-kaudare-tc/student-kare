<div class="bottom-nav-container">
  @for (item of navItems; track item.route) {
  <button (click)="router.navigate([item.route])" class="nav-item">

    <!-- Home Icon -->
    @if (item.icon === 'home') {
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 21V9L12 3L20 9V21H14V14H10V21H4Z" [attr.stroke]="isActive(item.route) ? '#5732EE' : '#A3ADC2'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    }

    <!-- Categories Icon (2x2 grid) -->
    @if (item.icon === 'shop') {
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M2.5 2.5H8.33333V8.33333H2.5V2.5Z" [attr.stroke]="isActive(item.route) ? '#5732EE' : '#A3ADC2'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M11.6667 2.5H17.5V8.33333H11.6667V2.5Z" [attr.stroke]="isActive(item.route) ? '#5732EE' : '#A3ADC2'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M2.5 11.6667H8.33333V17.5H2.5V11.6667Z" [attr.stroke]="isActive(item.route) ? '#5732EE' : '#A3ADC2'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M11.6667 11.6667H17.5V17.5H11.6667V11.6667Z" [attr.stroke]="isActive(item.route) ? '#5732EE' : '#A3ADC2'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    }

    <!-- Cart Icon -->
    @if (item.icon === 'cart') {
    <div class="relative flex flex-col items-center">

      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M18 16C16.89 16 16 16.89 16 18C16 18.5304 16.2107 19.0391 16.5858 19.4142C16.9609 19.7893 17.4696 20 18 20C18.5304 20 19.0391 19.7893 19.4142 19.4142C19.7893 19.0391 20 18.5304 20 18C20 17.4696 19.7893 16.9609 19.4142 16.5858C19.0391 16.2107 18.5304 16 18 16ZM2 0V2H4L7.6 9.59L6.24 12.04C6.09 12.32 6 12.65 6 13C6 13.5304 6.21071 14.0391 6.58579 14.4142C6.96086 14.7893 7.46957 15 8 15H20V13H8.42C8.3537 13 8.29011 12.9737 8.24322 12.9268C8.19634 12.8799 8.17 12.8163 8.17 12.75C8.17 12.7 8.18 12.66 8.2 12.63L9.1 11H16.55C17.3 11 17.96 10.58 18.3 9.97L21.88 3.5C21.95 3.34 22 3.17 22 3C22 2.73478 21.8946 2.48043 21.7071 2.29289C21.5196 2.10536 21.2652 2 21 2H6.21L5.27 0M8 16C6.89 16 6 16.89 6 18C6 18.5304 6.21071 19.0391 6.58579 19.4142C6.96086 19.7893 7.46957 20 8 20C8.53043 20 9.03914 19.7893 9.41421 19.4142C9.78929 19.0391 10 18.5304 10 18C10 17.4696 9.78929 16.9609 9.41421 16.5858C9.03914 16.2107 8.53043 16 8 16Z"
          fill="url(#paint0_linear_760_147)" />
        <line x1="0.5" y1="23.5" x2="23.5" y2="23.5" stroke="url(#paint1_linear_760_147)" stroke-linecap="round" />
        <defs>
          <linearGradient id="paint0_linear_760_147" x1="2.55556" y1="1.34328" x2="20.7329" y2="6.19333" gradientUnits="userSpaceOnUse">
            <stop stop-color="#3E63DD" />
          </linearGradient>
          <linearGradient id="paint1_linear_760_147" x1="0.5" y1="23.5" x2="23.5" y2="23.5" gradientUnits="userSpaceOnUse">
            <stop stop-color="#3E63DD" />
          </linearGradient>
        </defs>

      </svg>
      @if (cartCount > 0) {
      <span class="absolute -top-[2px] -right-[5px] bg-[#EE4D4D] text-white text-[9px] font-bold rounded-full w-4 h-4 flex items-center justify-center border-2 border-white shadow-sm">{{ cartCount }}</span>
      }
    </div>
    }

    <!-- Orders Icon (Isometric Box) -->
    @if (item.icon === 'orders') {
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 21L21 16.5V7.5L12 3L3 7.5V16.5L12 21Z" [attr.stroke]="isActive(item.route) ? '#5732EE' : '#A3ADC2'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M12 12V21M12 12L21 7.5M12 12L3 7.5" [attr.stroke]="isActive(item.route) ? '#5732EE' : '#A3ADC2'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M7.5 5.25L16.5 9.75" [attr.stroke]="isActive(item.route) ? '#5732EE' : '#A3ADC2'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    }

    <span class="nav-label" [style.color]="isActive(item.route) ? '#5732EE' : '#8C9099'">
      {{ item.label }}
    </span>
  </button>
  }
</div>

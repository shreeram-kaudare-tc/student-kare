<div class="relative flex flex-col bg-white rounded-[8px] border border-[#EAEAEA] overflow-hidden" 
     style="width: 139px; height: 168px; padding: 5px 6px; gap: 7px; box-shadow: 1px 1px 4px 0px rgba(0,0,0,0.10);">

  <!-- Wishlist heart -->
  <button (click)="onWishlist($event)" class="absolute top-[8px] right-[8px] z-10 w-[20px] h-[20px] flex items-center justify-center">
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path fill-rule="evenodd" clip-rule="evenodd" d="M1.43593 5.79916C0.899433 4.12416 1.52643 2.20966 3.28493 1.64316C4.20993 1.34466 5.23093 1.52066 5.99993 2.09916C6.72743 1.53666 7.78593 1.34666 8.70993 1.64316C10.4684 2.20966 11.0994 4.12416 10.5634 5.79916C9.72843 8.45416 5.99993 10.4992 5.99993 10.4992C5.99993 10.4992 2.29893 8.48516 1.43593 5.79916Z" stroke="#909090" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M8 3.35C8.535 3.523 8.913 4.0005 8.9585 4.561" stroke="#909090" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>

  <!-- Product image container -->
  <div class="w-full bg-[#E2E8F0] rounded-[6px] flex items-center justify-center overflow-hidden" style="height: 101px;">
    <img [src]="product.image" [alt]="product.name" class="object-contain" style="width: 119px; height: 101px;" />
  </div>

  <!-- Product name -->
  <p class="text-[10px] font-medium text-[#1A1C1E] leading-[14px] line-clamp-2 px-[2px]">
    {{ product.name }}
  </p>

  <!-- Price + Add button -->
  <div class="flex items-center justify-between px-[2px] mt-auto">
    <span class="text-[12px] font-bold text-[#5732EE]">Rs. {{ product.price }}</span>
    
    <div class="h-[24px] w-[60px]">
      @if (!product.quantity) {
        <button (click)="onAdd($event)" class="w-full h-full rounded-full border border-[#5732EE] bg-white text-[#5732EE] text-[10px] font-medium flex items-center justify-center gap-[4px] cursor-pointer hover:bg-blue-50 active:scale-95 transition-all">
          Add
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
        </button>
      } @else {
        <div class="w-full h-full rounded-full bg-[#3E63DD] text-white flex items-center justify-between px-[6px] shadow-sm select-none">
          <button (click)="onDecrease($event)" class="text-[14px] font-medium cursor-pointer w-[14px] flex justify-center items-center h-full active:opacity-70">&minus;</button>
          <span class="text-[12px] font-medium tracking-tight">{{ product.quantity }}</span>
          <button (click)="onIncrease($event)" class="text-[14px] font-medium cursor-pointer w-[14px] flex justify-center items-center h-full active:opacity-70">+</button>
        </div>
      }
    </div>
  </div>

</div>

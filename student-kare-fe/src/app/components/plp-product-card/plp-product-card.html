<div class="relative flex flex-col bg-white rounded-[2px] border border-[#EAEAEA] overflow-hidden w-full"
     style="padding: 5px 6px; gap: 7px; box-shadow: 1px 1px 4px 0px rgba(0,0,0,0.10);">

  <!-- Wishlist heart -->
  <button (click)="onWishlist($event)" class="absolute top-[8px] right-[8px] z-10 w-[20px] h-[20px] flex items-center justify-center">
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path fill-rule="evenodd" clip-rule="evenodd" d="M1.43593 5.79916C0.899433 4.12416 1.52643 2.20966 3.28493 1.64316C4.20993 1.34466 5.23093 1.52066 5.99993 2.09916C6.72743 1.53666 7.78593 1.34666 8.70993 1.64316C10.4684 2.20966 11.0994 4.12416 10.5634 5.79916C9.72843 8.45416 5.99993 10.4992 5.99993 10.4992C5.99993 10.4992 2.29893 8.48516 1.43593 5.79916Z" stroke="#909090" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M8 3.35C8.535 3.523 8.913 4.0005 8.9585 4.561" stroke="#909090" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>

  <!-- Product image container - Fixed Figma size 119x101, filling the space -->
  <div class="w-[119px] h-[101px] rounded-[2px] flex items-center justify-center overflow-hidden mx-auto">
    <img [src]="product.image" [alt]="product.name" class="object-cover w-full h-full" />
  </div>

  <!-- Product name - Center aligned with fixed height -->
  <p class="text-[10px] font-medium text-[#1A1C1E] leading-[14px] line-clamp-2 px-[2px] h-[28px] mb-[2px] text-center">
    {{ product.name }}
  </p>

    <!-- Price + Add button - Precision Footer -->
    <div class="flex items-center justify-between px-[2px] mt-auto min-h-[32px] gap-[4px]">
      <div class="flex-shrink-0">
        <span class="text-[12px] font-bold text-[#3E63DD] leading-none">Rs. {{ product.price }}</span>
      </div>
      
      <div class="flex-shrink-0 flex items-center h-[32px]">
        @if (!product.quantity) {
          <button (click)="onAdd($event)" class="w-[87px] h-[19px] rounded-[99px] btn-primary-gradient text-white text-[10px] font-semibold flex items-center justify-center cursor-pointer active:scale-95 transition-all whitespace-nowrap px-1">
            Add To Cart
          </button>
        } @else {
          <div class="w-[87px] h-[19px] rounded-[99px] bg-[#3E63DD] text-white flex items-center justify-between px-[10px] shadow-sm select-none">
            <button (click)="onDecrease($event)" class="text-[12px] font-medium cursor-pointer w-[14px] flex justify-center items-center h-full active:opacity-70">&minus;</button>
            <span class="text-[10px] font-medium leading-none text-center flex-1">{{ product.quantity }}</span>
            <button (click)="onIncrease($event)" class="text-[12px] font-medium cursor-pointer w-[14px] flex justify-center items-center h-full active:opacity-70">+</button>
          </div>
        }
      </div>
    </div>




</div>

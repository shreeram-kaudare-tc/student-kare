<div class="relative flex flex-col bg-white rounded-[2px] border border-[#EAEAEA] overflow-hidden w-full"
  style="padding: 5px clamp(4px, 1.5vw, 6px); gap: 7px; box-shadow: 1px 1px 4px 0px rgba(0,0,0,0.10);">

  <!-- Wishlist heart -->
  <!-- Wishlist heart -->
  <button (click)="onWishlist($event)"
    class="absolute top-[8px] right-[8px] z-10 w-[20px] h-[20px] flex items-center justify-center">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <g transform="translate(2, 2)">
        <path
          d="M10 18.35L8.55 17.03C3.4 12.36 0 9.28 0 5.5C0 2.42 2.42 0 5.5 0C7.24 0 8.91 0.81 10 2.09C11.09 0.81 12.76 0 14.5 0C17.58 0 20 2.42 20 5.5C20 9.28 16.6 12.36 11.45 17.04L10 18.35Z"
          [attr.fill]="product.wishlisted ? '#3D63DE' : 'none'" [attr.stroke]="product.wishlisted ? 'none' : '#909090'"
          [attr.stroke-width]="product.wishlisted ? '0' : '1.8'" />
        <rect x="14.5" y="4.5" width="2.5" height="5.5" rx="1.25" [attr.fill]="product.wishlisted ? 'white' : '#909090'"
          fill-opacity="1" transform="rotate(15 14.5 4.5)" />
      </g>
    </svg>
  </button>

  <!-- Product image — scales with card width, fixed aspect ratio -->
  <div class="w-full rounded-[2px] overflow-hidden" style="aspect-ratio: 1 / 0.85;">
    <img [src]="product.image" [alt]="product.name" class="object-cover w-full h-full block" />
  </div>

  <!-- Product name -->
  <p class="font-medium text-[rgba(34,34,34,1)] leading-[1.4] line-clamp-2 px-[2px] text-center"
    style="font-size: clamp(9px, 2.5vw, 11px); min-height: calc(clamp(9px, 2.5vw, 11px) * 1.4 * 2);">
    {{ product.name }}
  </p>

  <!-- Price + Add button -->
  <div class="flex items-center justify-between px-[1px] mt-auto gap-[2px] flex-nowrap">
    <span class="font-bold text-[#3E63DD] leading-none shrink" style="font-size: clamp(9.5px, 3vw, 13px);">Rs. {{
      product.price }}</span>

    <div class="flex-shrink-0 flex items-center" style="height: clamp(24px, 6.5vw, 30px);">
      @if (!product.quantity) {
      <!-- Style for Home screen (Default) -->
      @if (variant === 'home') {
      <button (click)="onAdd($event)"
        class="rounded-[99px] btn-primary-gradient text-white font-semibold flex items-center justify-center cursor-pointer active:scale-95 transition-all whitespace-nowrap"
        style="height: clamp(24px, 6.5vw, 30px); padding: 0 clamp(4px, 2.5vw, 14px); font-size: clamp(9px, 2.4vw, 11px);">
        Add To Cart
      </button>
      }
      <!-- Style for PLP screen -->
      @else {
      <button (click)="onAdd($event)"
        class="rounded-[99px] border border-[#3E63DD] text-[#3E63DD] font-bold flex items-center justify-center cursor-pointer active:scale-95 transition-all whitespace-nowrap bg-white"
        style="width: 58px; height: 19px; gap: 3px;">
        <span
          style="font-size: 10px; width: 21px; height: 11px; line-height: 11px; font-weight: 400; display: inline-block; text-align: center;">Add</span>
        <svg width="11" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"></path>
        </svg>
      </button>
      }
      } @else {
      <div class="rounded-[99px] bg-[#3E63DD] text-white flex items-center justify-between shadow-sm select-none"
        style="height: clamp(24px, 6.5vw, 30px); width: clamp(64px, 19vw, 92px); padding: 0 clamp(4px, 2vw, 10px);">
        <button (click)="onDecrease($event)"
          class="font-medium cursor-pointer flex justify-center items-center h-full active:opacity-70"
          style="font-size: clamp(10px, 3vw, 14px); width: clamp(10px, 3.5vw, 16px);">&minus;</button>
        <span class="font-medium leading-none text-center flex-1" style="font-size: clamp(9px, 2.5vw, 11px);">{{
          product.quantity }}</span>
        <button (click)="onIncrease($event)"
          class="font-medium cursor-pointer flex justify-center items-center h-full active:opacity-70"
          style="font-size: clamp(10px, 3vw, 14px); width: clamp(10px, 3.5vw, 16px);">+</button>
      </div>
      }
    </div>
  </div>

</div>

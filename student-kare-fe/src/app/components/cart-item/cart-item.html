<div class="flex items-center gap-3 bg-white rounded-2xl p-3 shadow-sm">
  <img [src]="item.image" [alt]="item.name" class="w-16 h-16 rounded-xl object-cover flex-shrink-0" />
  <div class="flex-1 min-w-0">
    <h3 class="text-sm font-semibold text-gray-800 truncate">{{ item.name }}</h3>
    <p class="text-sm font-bold text-orange-500 mt-0.5">₹{{ item.price }}</p>
    <div class="flex items-center gap-2 mt-2">
      <button (click)="onDecrease()" class="w-7 h-7 rounded-full border border-gray-300 flex items-center justify-center hover:bg-gray-100 transition">
        <svg class="w-3 h-3 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M20 12H4" /></svg>
      </button>
      <span class="text-sm font-bold text-gray-800 w-4 text-center">{{ item.quantity }}</span>
      <button (click)="onIncrease()" class="w-7 h-7 rounded-full bg-orange-500 text-white flex items-center justify-center hover:bg-orange-600 transition">
        <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4" /></svg>
      </button>
    </div>
  </div>
  <div class="flex flex-col items-end gap-2">
    <button (click)="onRemove()" class="text-gray-300 hover:text-red-400 transition">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
    </button>
    <span class="text-sm font-bold text-gray-900">₹{{ total }}</span>
  </div>
</div>

<div class="flex flex-col gap-1 w-full">
  @if (label) {
    <label class="text-sm font-medium text-gray-700">{{ label }}</label>
  }
  <div class="relative flex items-center">
    @if (icon) {
      <span class="absolute left-3 text-gray-400 text-lg">{{ icon }}</span>
    }
    <input
      [type]="inputType"
      [placeholder]="placeholder"
      [value]="value"
      [disabled]="disabled"
      (input)="onInput($event)"
      (blur)="onBlur()"
      [class]="'w-full border rounded-2xl py-3 pr-4 text-gray-800 bg-white focus:outline-none focus:ring-2 focus:ring-orange-400 transition ' + (icon ? 'pl-10' : 'pl-4') + (error ? ' border-red-400' : ' border-gray-200')"
    />
    @if (type === 'password') {
      <button type="button" (click)="togglePassword()" class="absolute right-3 text-gray-400 hover:text-gray-600">
        @if (showPassword) { <span>&#128064;</span> } @else { <span>&#128065;</span> }
      </button>
    }
  </div>
  @if (error) {
    <p class="text-xs text-red-500 mt-1">{{ error }}</p>
  }
</div>

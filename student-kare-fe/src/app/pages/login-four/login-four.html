<app-auth-layout1>
    <div class="flex flex-col items-center  justify-between px-4 pb-4">
        <!-- Status Bar -->
        <div class="absolute top-2 left-4 right-4 flex items-center justify-between h-11">
            <span class="text-sm font-semibold text-[#021433]">9:41</span>
            <div class="flex items-center gap-1.5">
                <svg width="18" height="12" viewBox="0 0 18 12" fill="none">
                    <rect x="0" y="8" width="3" height="4" rx="1" fill="#021433" />
                    <rect x="5" y="6" width="3" height="6" rx="1" fill="#021433" />
                    <rect x="10" y="3" width="3" height="9" rx="1" fill="#021433" />
                    <rect x="15" y="0" width="3" height="12" rx="1" fill="#021433" />
                </svg>
                <svg width="16" height="12" viewBox="0 0 16 12" fill="none">
                    <circle cx="8" cy="10" r="1.5" fill="#021433" />
                    <path d="M4.5 7.5C5.5 6.5 6.7 6 8 6s2.5.5 3.5 1.5" stroke="#021433" stroke-width="1.5" stroke-linecap="round" />
                    <path d="M1.5 4.5C3.2 2.8 5.5 2 8 2s4.8.8 6.5 2.5" stroke="#021433" stroke-width="1.5" stroke-linecap="round" />
                </svg>
                <svg width="28" height="14" viewBox="0 0 28 14" fill="none">
                    <rect x="0.5" y="0.5" width="24" height="13" rx="3" stroke="#021433" stroke-opacity="0.35" />
                    <rect x="2" y="2" width="20" height="10" rx="2" fill="#021433" />
                    <path d="M26 5v4a2 2 0 000-4z" fill="#021433" fill-opacity="0.4" />
                </svg>
            </div>
        </div>
        <div class="flex flex-col w-full  bg-white rounded-[30px] border border-[#E9EAF2] shadow-[0_20px_38px_rgba(24,25,70,0.16)]  px-[15px] py-[15px] gap-[24px]">
            <div class="flex flex-col items-center">
                <div class="flex items-baseline gap-[4px]">
                    <span class="text-[32px] leading-[40px] font-bold text-[#3E63DD]">Student</span>
                    <span class="text-[32px] leading-[40px] font-bold text-[#F15A24]">Kare<sup class="text-[10px] font-semibold align-super">®</sup></span>
                </div>
                <p class="text-[13px] leading-[18px] text-[#8F99B3] ">Broaden your child's horizon</p>
            </div>

            <div class="flex flex-col gap-[12px]">
                <h1 class="h-[42px] mx-auto text-[32px] leading-[42px] font-bold text-[#1A1C1E] text-center">Get Started now</h1>
                <div class="flex flex-col">
                    <span class="text-[12px] leading-[18px] font-normal text-[#6C7278]  text-center ">Create an account or log in to explore </span>
                    <span class="text-[12px]  font-normal text-[#6C7278]  text-center">about our app</span>
                </div>
            </div>
            <div class="flex items-center justify-between  h-[36px] rounded-[7px] gap-[1px] p-[2px] bg-[#F5F6F9] border border-[#F5F6F9] shadow-[inset_0px_3px_6px_0px_rgba(0,0,0,0.02)]">
                <button (click)="setLoginMode('vibgyor')" [class]="loginMode==='vibgyor' ? 'w-[130px] h-[32px] rounded-[7px] bg-white text-[14px]  font-medium text-[#232447] text-center' : 'w-[130px] h-[32px] rounded-[6px] bg-[#F5F6F9] border border-[#EFF0F6]/50 shadow-[inset_0px_-2px_2px_0px_rgba(0,0,0,0.03),0px_1px_2px_0px_rgba(228,229,231,0.24)] text-[14px]  font-medium text-[#7D7D91] text-center'">With Vibgyor</button>
                <button (click)="setLoginMode('without')" [class]="loginMode==='without' ? 'w-[130px] h-[32px] rounded-[7px] bg-white text-[14px]  font-medium text-[#232447] text-center' : 'w-[130px] h-[32px] rounded-[6px] bg-[#F5F6F9] border border-[#EFF0F6]/50 shadow-[inset_0px_-2px_2px_0px_rgba(0,0,0,0.03),0px_1px_2px_0px_rgba(228,229,231,0.24)] text-[14px]  font-semibold text-[#7D7D91] text-center'">Without Vibgyor</button>
            </div>

            <div class="flex flex-col gap-[6px]">
                <label class="block text-[12px] font-normal leading-[18px] text-[#556087] ">Mobile Number</label>
                <app-input-field type="tel" placeholder="89765434567" [(ngModel)]="mobileNumber" class="w-full h-[52px] rounded-[14px] ">
                </app-input-field>
            </div>

            <div class="flex flex-col gap-[24px]">
                <div class="flex justify-center items-center ">
                    <app-button class="w-[186px]" variant="primary" [fullWidth]="true" (click)="sendOtp()"> Send OTP </app-button>
                </div>

                <p class="text-[12px] leading-[16.8px] text-[#6C7278] text-center font-medium tracking-[-0.01em]">Don\'t have an account? <a (click)="register()" class="text-[#3E63DD] font-semibold hover:underline cursor-pointer">Register</a></p>
            </div>

        </div>
        <!-- <div class="w-full flex items-center justify-center h-[34px]">
            <div class="w-[148px] h-[5px] rounded-full bg-[#111827]"></div>
        </div> -->
    </div>
</app-auth-layout1>

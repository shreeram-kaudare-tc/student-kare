<div class="relative w-full h-screen bg-white flex flex-col overflow-hidden font-jakarta">

  <!-- Purple Header -->
  <div class="flex-shrink-0 flex items-center justify-between px-[16px] bg-[#795BF1]"
       style="height: 50px;">
    <button (click)="goBack()"
            class="w-[32px] h-[32px] flex items-center justify-center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 5l-7 7 7 7"/>
      </svg>
    </button>
    <button class="w-[32px] h-[32px] flex items-center justify-center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    </button>
  </div>

  <!-- Body: Sidebar + Content -->
  <div class="flex flex-1 overflow-hidden">

    <!-- Left Sidebar -->
    <div class="flex-shrink-0 bg-white overflow-y-auto overflow-x-hidden"
         style="width: 93px; box-shadow: 0px 1px 5.8px 0px rgba(0,0,0,0.12);">
      <div class="flex flex-col pt-[12px] pb-[20px]"
           style="gap: 21px; padding-left: 15px;">
        @for (cat of sideCategories; track cat.label + $index; let i = $index) {
        <button (click)="selectCategory(i)"
                class="relative flex flex-col items-center gap-[4px] w-[60px]">

          <!-- Active gradient D-shape bg: bleeds to sidebar left edge -->
          @if (i === activeCategory) {
          <div class="absolute pointer-events-none"
               style="left: -15px; top: -4px; width: 81px; height: 69px;
                      background: linear-gradient(135deg, #EEEAFD 0%, #8C6DFF 100%);
                      border-radius: 0 40px 40px 0;
                      z-index: 0;">
          </div>
          }

          <!-- Image -->
          <div class="relative flex items-center justify-center z-10"
               style="width: 60px; height: 60px;">
            <img [src]="cat.image" [alt]="cat.label"
                 class="w-[44px] h-[44px] object-contain" />
          </div>

          <span class="relative z-10 text-[10px] leading-[18px] text-[#222222] text-center"
                style="font-weight: 500;">
            {{ cat.label }}
          </span>
        </button>
        }
      </div>
    </div>

    <!-- Right Content -->
    <div class="flex-1 flex flex-col overflow-hidden">

      <!-- Filter Chips Row -->
      <div class="flex-shrink-0 flex items-center gap-[8px] px-[10px] py-[10px] bg-white border-b border-[#F0F0F0]">
        <div class="flex items-center gap-[6px] overflow-x-auto scrollbar-hide flex-1">
          @for (f of filters; track f) {
          <app-category-chip
            [label]="f"
            [active]="activeFilter === f"
            (chipClick)="selectFilter($event)">
          </app-category-chip>
          }
        </div>
        <button (click)="openFilter()"
                class="flex-shrink-0 w-[28px] h-[28px] flex items-center justify-center">
          <svg width="20" height="18" viewBox="0 0 22 20" fill="none" stroke="#0D1B4B" stroke-width="2"
               stroke-linecap="round">
            <line x1="2" y1="5" x2="20" y2="5"/>
            <line x1="2" y1="10" x2="15" y2="10"/>
            <line x1="2" y1="15" x2="10" y2="15"/>
            <polyline points="17 13 20 16 17 19" stroke="#0D1B4B" stroke-width="2"/>
          </svg>
        </button>
      </div>

      <!-- Product Grid -->
      <div class="flex-1 overflow-y-auto px-[10px] pt-[10px]"
           [class.pb-[90px]]="cartCount > 0"
           [class.pb-[16px]]="cartCount === 0">
        <div class="grid grid-cols-2 gap-[8px]">
          @for (product of products; track product.id) {
          <app-plp-product-card
            [product]="product"
            (addToCart)="addToCart($event)"
            (toggleWishlist)="toggleWishlist($event)">
          </app-plp-product-card>
          }
        </div>
      </div>

    </div>
  </div>

  <!-- ── View Cart floating pill ── -->
  @if (cartCount > 0) {
  <div class="absolute bottom-[16px] z-20" style="left: 109px; right: 16px;">
    <button (click)="viewCart()"
            class="w-full flex items-center gap-[10px] rounded-[58px] bg-[#795BF1] px-[10px]"
            style="height: 62px; box-shadow: 1px 1px 4px 0px rgba(0,0,0,0.10);">

      <!-- Overlapping product thumbnails -->
      <div class="flex items-center flex-shrink-0" style="margin-left: 4px;">
        @for (item of cartItems.slice(0, 3); track item.id; let i = $index) {
        <div class="rounded-full border-2 border-white bg-white overflow-hidden flex-shrink-0"
             style="width: 38px; height: 38px; margin-left: -10px; box-shadow: 0 1px 4px rgba(0,0,0,0.15);">
          <img [src]="item.image" [alt]="item.name"
               class="w-full h-full object-contain" />
        </div>
        }
      </div>

      <!-- Text -->
      <div class="flex-1 flex flex-col" style="padding-left: 6px;">
        <span class="text-white leading-[20px]"
              style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 12px;">
          View Cart
        </span>
        <span class="text-white/80 text-[11px] leading-[16px]">
          {{ cartCount }} item{{ cartCount > 1 ? 's' : '' }}
        </span>
      </div>

      <!-- Arrow circle -->
      <div class="flex-shrink-0 flex items-center justify-center rounded-full bg-[#241562]"
           style="width: 30px; height: 30px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </div>

    </button>
  </div>
  }

</div>

<!-- ── Filter Bottom Sheet ── -->
<app-filter-sheet
  [visible]="filterSheetOpen"
  (closed)="onFilterClosed()">
</app-filter-sheet>

<!-- ── Flying product animation (fixed overlay) ── -->
@for (item of flyingItems; track item.id) {
<div class="flying-item"
     [style]="flyStyle(item)">
  <img [src]="item.image" class="w-full h-full object-contain" />
</div>
}

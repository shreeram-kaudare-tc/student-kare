<div class="relative w-full h-screen bg-white flex flex-col overflow-hidden font-jakarta">

  <!-- ── Scrollable content ── -->
  <div class="flex-1 overflow-y-auto" style="padding-bottom: 140px;">

    <!-- Header: exact 393×134px, gradient #3E63DD→#9A84F5, bottom radius 40px -->
    <div class="w-full flex flex-col justify-between px-[20px]"
         style="height: 134px;
                background: linear-gradient(135deg, #3E63DD 0%, #9A84F5 100%);
                border-bottom-left-radius: 40px;
                border-bottom-right-radius: 40px;
                padding-top: 1px;
                padding-bottom: 16px;
                gap: 10px;">

      <!-- Status bar (dark icons on gradient) -->
      <div class="flex items-center justify-between h-[44px]">
        <span class="text-[14px] font-semibold text-[#1A1C1E]">9:41</span>
        <div class="flex items-center gap-1.5">
          <svg width="18" height="12" viewBox="0 0 18 12" fill="none">
            <rect x="0" y="8" width="3" height="4" rx="1" fill="#1A1C1E"/>
            <rect x="5" y="6" width="3" height="6" rx="1" fill="#1A1C1E"/>
            <rect x="10" y="3" width="3" height="9" rx="1" fill="#1A1C1E"/>
            <rect x="15" y="0" width="3" height="12" rx="1" fill="#1A1C1E"/>
          </svg>
          <svg width="16" height="12" viewBox="0 0 16 12" fill="none">
            <circle cx="8" cy="10" r="1.5" fill="#1A1C1E"/>
            <path d="M4.5 7.5C5.5 6.5 6.7 6 8 6s2.5.5 3.5 1.5" stroke="#1A1C1E" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M1.5 4.5C3.2 2.8 5.5 2 8 2s4.8.8 6.5 2.5" stroke="#1A1C1E" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <svg width="28" height="14" viewBox="0 0 28 14" fill="none">
            <rect x="0.5" y="0.5" width="24" height="13" rx="3" stroke="#1A1C1E" stroke-opacity="0.35"/>
            <rect x="2" y="2" width="20" height="10" rx="2" fill="#1A1C1E"/>
            <path d="M26 5v4a2 2 0 000-4z" fill="#1A1C1E" fill-opacity="0.4"/>
          </svg>
        </div>
      </div>

      <!-- Search bar + icons row: 356×46 Hug -->
      <div class="flex items-center gap-[10px]" style="height: 46px;">
        <!-- Search input: flex-1, white, rounded-full, 46px tall -->
        <div class="flex items-center justify-between bg-white"
             style="width:285px; height:46px; border-radius:16px; padding-left:16px; padding-right:14px; flex-shrink:0;">
          <span class="text-[14px] text-[#C4C8D4]" style="font-weight:400; line-height:20px;">Search for groceries and more</span>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1A1C1E" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </div>
        <!-- Wallet icon (rounded square, white border) -->
        <button class="w-[38px] h-[38px] rounded-[10px] border-2 border-white flex items-center justify-center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="6" width="20" height="13" rx="2"/>
            <path d="M2 10h20"/>
            <circle cx="17" cy="14" r="1.2" fill="white"/>
          </svg>
        </button>
        <!-- Avatar icon (circle) -->
        <button class="w-[38px] h-[38px] rounded-full border-2 border-white flex items-center justify-center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8">
            <circle cx="12" cy="8" r="3.5"/>
            <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Cart title bar -->
    <div class="flex items-center justify-between px-[20px] h-[50px] bg-white">
      <button (click)="goBack()" class="w-[32px] h-[32px] flex items-center justify-center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#333"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 5l-7 7 7 7"/>
        </svg>
      </button>
      <span style="font-size:16px; font-weight:600; color:#363431; letter-spacing:1px; line-height:100%;">Cart</span>
      <button class="relative w-[32px] h-[32px] flex items-center justify-center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#333"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <path d="M16 10a4 4 0 01-8 0"/>
        </svg>
        @if (totalItems > 0) {
        <span class="absolute -top-[2px] -right-[2px] w-[14px] h-[14px] rounded-full bg-red-500 text-white text-[8px] font-bold flex items-center justify-center">
          {{ totalItems }}
        </span>
        }
      </button>
    </div>

    <!-- Cart item list -->
    <div class="flex flex-col bg-white">
      @for (item of items; track item.id) {

      <!-- Swipeable row wrapper -->
      <div class="relative overflow-hidden" style="height: 111px;">

        <!-- Delete reveal panel (behind the card) -->
        <div class="absolute right-0 top-0 bottom-0 w-[90px] bg-[#F5F5F5] flex flex-col items-center justify-center gap-[4px] rounded-r-[8px]"
             (click)="removeItem(item.id)">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E53935" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
            <path d="M10 11v6M14 11v6"/>
            <path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/>
          </svg>
          <span class="text-[12px] font-semibold text-[#E53935]">Remove</span>
        </div>

        <!-- Cart item card -->
        <div class="absolute inset-0 bg-white border-b border-[#F0F0F0] flex items-center"
             style="padding: 7px 10px; gap: 10px; transition: transform 0.2s ease;"
             [style.transform]="'translateX(' + item.swipeOffset + 'px)'"
             (touchstart)="onSwipeStart(item, $event)"
             (touchmove)="onSwipeMove(item, $event)"
             (touchend)="onSwipeEnd(item)">

          <!-- Product image -->
          <div class="flex-shrink-0 rounded-[12px] overflow-hidden bg-[#F5F5F5] flex items-center justify-center"
               style="width: 90px; height: 90px;">
            <img [src]="item.image" [alt]="item.name"
                 class="w-full h-full object-contain" />
          </div>

          <!-- Details -->
          <div class="flex-1 flex flex-col justify-between h-full py-[2px]">
            <div class="flex items-start justify-between">
              <div class="flex flex-col gap-[2px]">
                <span style="font-family:'Plus Jakarta Sans',sans-serif; font-size:14px; font-weight:500; line-height:20px; color:#363431;">{{ item.name }}</span>
                <div class="flex items-center gap-[4px]">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="#F59E0B">
                    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                  </svg>
                  <span class="text-[11px] text-[#9CA3AF]">({{ item.reviews }} reviews)</span>
                </div>
                <span style="font-family:'Plus Jakarta Sans',sans-serif; font-size:14px; font-weight:500; line-height:20px; color:#3E63DD;">${{ item.price }}.00</span>
              </div>
              <!-- Heart -->
              <button (click)="toggleWishlist(item)" class="w-[28px] h-[28px] flex items-center justify-center mt-[2px]">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                     [attr.stroke]="item.wishlisted ? '#5732EE' : '#C4C8D4'"
                     [attr.fill]="item.wishlisted ? '#5732EE' : 'none'"
                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                </svg>
              </button>
            </div>

            <!-- Quantity stepper -->
            <div class="flex justify-end">
              <div class="flex items-center gap-[8px] bg-[#F5F5F5] rounded-full px-[10px] py-[4px]">
                <button (click)="decrement(item)"
                        class="w-[20px] h-[20px] flex items-center justify-center text-[#1A1C1E] text-[18px] font-light leading-none">−</button>
                <span class="text-[13px] font-semibold text-[#1A1C1E] w-[16px] text-center">{{ item.quantity }}</span>
                <button (click)="increment(item)"
                        class="w-[20px] h-[20px] flex items-center justify-center text-[#5732EE] text-[18px] font-light leading-none">+</button>
              </div>
            </div>
          </div>

        </div>
      </div>
      }
    </div>

    <!-- Subtotal + Delivery -->
    <div class="bg-white px-[20px] pt-[16px] pb-[8px] mt-[8px]">
      <div class="flex items-center justify-between py-[10px]">
        <span class="text-[14px] text-[#1A1C1E]">Subtotal</span>
        <span class="text-[14px] font-semibold text-[#1A1C1E]">₹{{ subtotal | number:'1.2-2' }}</span>
      </div>
      <div class="h-[1px] bg-[#F0F0F0]"></div>
      <div class="flex items-center justify-between py-[10px]">
        <span class="text-[14px] font-medium text-[#1A1C1E]">Total Delivery Charges</span>
        <span class="text-[14px] font-bold text-[#22C55E]">FREE</span>
      </div>
    </div>

  </div>

  <!-- Bottom nav (renders fixed at bottom via its own CSS) -->
  <app-bottom-nav></app-bottom-nav>

  <!-- Checkout button fixed just above bottom nav (nav is h-16 = 64px) -->
  <div class="fixed inset-x-0 z-40 px-[16px] py-[10px] bg-white"
       style="bottom: 64px; border-top: 1px solid #F0F0F0;">
    <button (click)="checkout()"
            class="w-full h-[52px] rounded-full text-white text-[16px] font-semibold"
            style="background: linear-gradient(90deg, #5B3EEE 0%, #9B6BE8 100%);">
      Checkout
    </button>
  </div>

</div>

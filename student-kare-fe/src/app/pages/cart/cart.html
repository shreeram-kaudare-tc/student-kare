<div class="relative w-full h-screen bg-white flex flex-col overflow-hidden font-jakarta max-w-[425px] mx-auto">

  <!-- ── Main Scrollable View ── -->
  <div class="flex-1 overflow-y-auto" style="padding-bottom: 210px;">

    <!-- 1. Responsive Header (Gradient with 40px Radius) -->
    <div class="w-full relative overflow-hidden" 
         style="height: 134px; background: linear-gradient(135deg, #3E63DD 0%, #9A84F5 100%); border-radius: 0 0 40px 40px; padding: 1px 0;">
      
      <!-- Content Frame (Centered & Responsive) -->
      <div class="w-full flex flex-col justify-end pb-[16px] px-[20px]" style="height: 111px; margin-top: 13px;">
        <div class="flex items-center gap-[12px] md:gap-[21px]">
          <!-- Search Bar (Flexible) -->
          <div class="bg-white flex-1 flex items-center justify-between px-[16px]" style="height: 46px; border-radius: 16px;">
            <span class="text-[13px] md:text-[14px] text-[#C4C8D4] truncate font-normal">Search for groceries and more</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1C1E" stroke-width="2" stroke-linecap="round">
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
          </div>
          
          <!-- Icons Frame -->
          <div class="flex items-center gap-[8px] md:gap-[12px] flex-shrink-0">
            <button class="w-[32px] h-[32px] flex items-center justify-center">
              <svg width="21" height="18" viewBox="0 0 21 18" fill="none">
                <path d="M14.891 1.8375H2.86373C1.90918 0.91875 2.18876 0.269096 2.86373 0H14.891C18.2625 0 21.0001 2.63497 21.0001 5.88V13.7812C21.0001 14.7 20.0455 14.7 19.091 13.7812V5.88C19.091 3.64927 17.2086 1.8375 14.891 1.8375Z" fill="white"/>
                <path fill-rule="evenodd" clip-rule="evenodd" d="M14.8909 3.67505H2.29091C1.02614 3.67505 0 4.74447 0 6.0638V15.0675C0 16.3869 1.02614 17.4563 2.29091 17.4563H14.8909C16.1557 17.4563 17.1818 16.3869 17.1818 15.0675V6.0638C17.1818 4.74447 16.1557 3.67505 14.8909 3.67505Z" fill="white"/>
              </svg>
            </button>
            <button class="w-[32px] h-[32px] rounded-full overflow-hidden flex items-center justify-center">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
                <circle cx="12" cy="7" r="4" />
                <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8H4z" />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- 2. Sticky Page Title Bar -->
    <div class="w-full flex items-center justify-between px-[20px] bg-white sticky top-0 z-30" style="height: 50px;">
      <button (click)="goBack()" class="w-[32px] h-[32px] flex items-center justify-center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#363431" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg>
      </button>
      <span class="text-[16px] font-semibold text-[#363431]">Cart</span>
      <div class="relative flex items-center justify-center w-[32px] h-[32px]">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#363431" stroke-width="2">
          <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6" />
          <circle cx="9" cy="21" r="1" />
          <circle cx="20" cy="21" r="1" />
        </svg>
        @if (totalItems > 0) {
        <span class="absolute -top-[2px] -right-[2px] bg-[#E90101] text-white text-[8px] font-bold rounded-full w-[14px] h-[14px] flex items-center justify-center border border-white">
          {{ totalItems }}
        </span>
        }
      </div>
    </div>

    <!-- 3. Scrollable Product Feed -->
    <div class="flex flex-col bg-white">
      @for (item of items; track item.id) {
      <div class="relative overflow-hidden w-full border-b border-[#F5F5F5]" style="height: 111px;">
        
        <!-- Swipe Delete Reveal (Hidden Action) -->
        <div class="absolute right-0 top-0 bottom-0 bg-[#FBE9E9] flex flex-col items-center justify-center gap-[4px] px-[20px]" 
             (click)="removeItem(item.id)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E90101" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2" />
            </svg>
            <span class="text-[10px] font-bold text-[#E90101]">Remove</span>
        </div>

        <!-- Card Body (Slideable) -->
        <div class="absolute inset-0 bg-white flex items-center px-[10px] gap-[12px] transition-transform duration-200"
             [style.transform]="'translateX(' + item.swipeOffset + 'px)'"
             (touchstart)="onSwipeStart(item, $event)" (touchmove)="onSwipeMove(item, $event)" (touchend)="onSwipeEnd(item)">
          
          <div class="w-[90px] h-[90px] bg-[#F5F5F5] rounded-[12px] flex items-center justify-center overflow-hidden flex-shrink-0">
            <img [src]="item.image" [alt]="item.name" class="w-[70px] h-[70px] object-contain" />
          </div>

          <div class="flex-1 flex flex-col justify-between h-[90px] py-[2px]">
            <div class="flex flex-col gap-[2px]">
              <div class="flex items-start justify-between">
                <span class="text-[14px] font-medium text-[#363431] leading-[18px] line-clamp-1">{{ item.name }}</span>
                <button (click)="toggleWishlist(item); $event.stopPropagation()" class="opacity-40">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#363431" stroke-width="2">
                    <path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z" />
                  </svg>
                </button>
              </div>
              <div class="flex items-center gap-[4px]">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="#F59E0B">
                  <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
                </svg>
                <span class="text-[11px] text-[#A3ADC2] font-medium">({{ item.reviews }} reviews)</span>
              </div>
            </div>
            
            <div class="flex items-center justify-between mt-auto">
              <span class="text-[14px] font-semibold text-[#3E63DD]">${{ item.price }}.00</span>
              <div class="flex items-center gap-[10px] bg-[#F5F6F9] rounded-full px-[10px] py-[4px]">
                <button (click)="decrement(item); $event.stopPropagation()" class="text-[#363431] text-[18px] select-none">−</button>
                <span class="text-[13px] font-bold text-[#363431] min-w-[12px] text-center">{{ item.quantity }}</span>
                <button (click)="increment(item); $event.stopPropagation()" class="text-[#5732EE] text-[18px] select-none">+</button>
              </div>
            </div>
          </div>
        </div>
      </div>
      }
    </div>
  </div>

  <!-- ── Fluid Sticky Dashboard Footer ── -->
  <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-[#F0F0F0] z-[100] flex flex-col items-center max-w-[425px] mx-auto" 
       style="box-shadow: 0px -4px 12px rgba(0,0,0,0.05); height: calc(214px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);">
    
    <div class="flex-1 w-full px-[20px] flex flex-col justify-center gap-[12px] pt-[10px]">
      <div class="flex flex-col gap-[8px]">
        <div class="flex items-center justify-between">
          <span class="text-[14px] text-[#363431] font-medium">Subtotal</span>
          <span class="text-[14px] font-bold text-[#363431]">₹{{ subtotal | number:'1.2-2' }}</span>
        </div>
        <div class="h-[1px] bg-[#F5F5F5] w-full"></div>
        <div class="flex items-center justify-between">
          <span class="text-[14px] text-[#363431] font-medium">Total Delivery Charges</span>
          <span class="text-[14px] font-bold text-[#22C55E]">FREE</span>
        </div>
      </div>

      <!-- Tab Bar Row -->
      <div class="flex items-center justify-between px-[5px] py-[6px] border-t border-[#F5F5F5]">
        <button (click)="router.navigate(['/home'])" class="flex flex-col items-center gap-[2px] opacity-40">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A3ADC2" stroke-width="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span class="text-[9px] font-bold">Home</span>
        </button>
        <button (click)="router.navigate(['/plp'])" class="flex flex-col items-center gap-[2px] opacity-40">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A3ADC2" stroke-width="1.8"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          <span class="text-[9px] font-bold">Categories</span>
        </button>
        <button class="flex flex-col items-center gap-[2px]">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5732EE" stroke-width="2.2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L21 6H6"/></svg>
          <span class="text-[9px] font-bold text-[#5732EE]">Cart</span>
        </button>
        <button (click)="router.navigate(['/my-order'])" class="flex flex-col items-center gap-[2px] opacity-40">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A3ADC2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 21L21 16.5V7.5L12 3L3 7.5V16.5L12 21Z" />
            <path d="M12 12V21M12 12L21 7.5M12 12L3 7.5" />
            <path d="M7.5 5.25L16.5 9.75" />
          </svg>
          <span class="text-[9px] font-bold text-[#A3ADC2]">Orders</span>
        </button>
      </div>
    </div>

    <!-- Action Action Button Row -->
    <div class="w-full px-[10px] pb-[8px]">
      <button (click)="checkout()"
              class="w-full active:scale-95 transition-transform flex items-center justify-center text-white text-[16px] font-bold"
              style="height: 50px; border-radius: 28px;
                     background: linear-gradient(135deg, #795BF1 0%, #5732EE 100%);
                     box-shadow: 0px 4px 12px rgba(87, 50, 238, 0.28);">
        Checkout
      </button>
    </div>
  </div>

</div>

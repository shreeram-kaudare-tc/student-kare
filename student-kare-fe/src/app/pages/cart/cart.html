<div class="relative w-full h-screen bg-white flex flex-col overflow-hidden font-jakarta">

  <!-- ── Scrollable content ── -->
  <div class="flex-1 overflow-y-auto" style="padding-bottom: 140px;">

    <!-- Header: exact 393×134px, gradient #3E63DD→#9A84F5, bottom radius 40px -->
    <div class="w-full flex flex-col justify-between px-[20px]" style="height: 134px;
                background: linear-gradient(135deg, #3E63DD 0%, #9A84F5 100%);
                border-bottom-left-radius: 40px;
                border-bottom-right-radius: 40px;
                padding-top: 1px;
                padding-bottom: 16px;
                gap: 10px;">



      <!-- Search bar + icons row: 356×46 Hug -->
      <div class="flex items-center gap-[10px]" style="height: 46px;">
        <!-- Search input: flex-1, white, rounded-full, 46px tall -->
        <div class="flex items-center justify-between bg-white" style="width:285px; height:46px; border-radius:16px; padding-left:16px; padding-right:14px; flex-shrink:0;">
          <span class="text-[14px] text-[#C4C8D4]" style="font-weight:400; line-height:20px;">Search for groceries and more</span>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1A1C1E" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
        </div>
        <!-- Wallet icon (rounded square, white border) -->
        <button class="w-[28px] h-[28px] rounded-[10px]s flex items-center justify-center">
          <svg width="21" height="18" viewBox="0 0 21 18" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M14.891 1.8375H2.86373C2.61056 1.8375 2.36777 1.7407 2.18876 1.5684C2.00975 1.39611 1.90918 1.16242 1.90918 0.91875C1.90918 0.675082 2.00975 0.441395 2.18876 0.269096C2.36777 0.0967966 2.61056 0 2.86373 0H14.891C18.2625 0 21.0001 2.63497 21.0001 5.88V13.7812C21.0001 14.0249 20.8995 14.2586 20.7205 14.4309C20.5415 14.6032 20.2987 14.7 20.0455 14.7C19.7924 14.7 19.5496 14.6032 19.3706 14.4309C19.1916 14.2586 19.091 14.0249 19.091 13.7812V5.88C19.091 3.64927 17.2086 1.8375 14.891 1.8375Z"
              fill="white" />
            <path fill-rule="evenodd" clip-rule="evenodd"
              d="M14.8909 3.67505H2.29091C1.02614 3.67505 0 4.74447 0 6.0638V15.0675C0 16.3869 1.02614 17.4563 2.29091 17.4563H14.8909C16.1557 17.4563 17.1818 16.3869 17.1818 15.0675V6.0638C17.1818 4.74447 16.1557 3.67505 14.8909 3.67505ZM14.3182 10.5657C14.3182 10.9312 14.1673 11.2817 13.8988 11.5402C13.6303 11.7986 13.2661 11.9438 12.8864 11.9438C12.5066 11.9438 12.1424 11.7986 11.8739 11.5402C11.6054 11.2817 11.4545 10.9312 11.4545 10.5657C11.4545 10.2002 11.6054 9.84964 11.8739 9.59119C12.1424 9.33274 12.5066 9.18755 12.8864 9.18755C13.2661 9.18755 13.6303 9.33274 13.8988 9.59119C14.1673 9.84964 14.3182 10.2002 14.3182 10.5657Z"
              fill="white" />
          </svg>
        </button>
        <!-- Avatar icon (circle) -->
        <button class="w-[28px] h-[28px] rounded-fulls flex items-center justify-center">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M14 8C14 9.06087 13.5786 10.0783 12.8284 10.8284C12.0783 11.5786 11.0609 12 10 12C8.93913 12 7.92172 11.5786 7.17157 10.8284C6.42143 10.0783 6 9.06087 6 8C6 6.93913 6.42143 5.92172 7.17157 5.17157C7.92172 4.42143 8.93913 4 10 4C11.0609 4 12.0783 4.42143 12.8284 5.17157C13.5786 5.92172 14 6.93913 14 8Z" fill="white" />
            <path fill-rule="evenodd" clip-rule="evenodd"
              d="M9.592 19.992C4.2585 19.778 0 15.386 0 10C0 4.477 4.477 0 10 0C15.523 0 20 4.477 20 10C20 15.523 15.523 20 10 20H9.863C9.77233 20 9.682 19.9973 9.592 19.992ZM3.583 16.31C3.50823 16.0953 3.48278 15.8665 3.50854 15.6406C3.5343 15.4147 3.6106 15.1975 3.73179 15.0051C3.85298 14.8128 4.01593 14.6502 4.20856 14.5294C4.40119 14.4086 4.61855 14.3328 4.8445 14.3075C8.7425 13.876 11.2815 13.915 15.1605 14.3165C15.3868 14.3401 15.6046 14.4149 15.7976 14.5354C15.9905 14.6559 16.1534 14.8189 16.2739 15.0119C16.3943 15.2048 16.4691 15.4227 16.4927 15.649C16.5162 15.8753 16.4877 16.1039 16.4095 16.3175C18.0721 14.6355 19.0031 12.365 19 10C19 5.0295 14.9705 1 10 1C5.0295 1 1 5.0295 1 10C1 12.458 1.9855 14.686 3.583 16.31Z"
              fill="white" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Cart title bar -->
    <div class="flex items-center justify-between px-[20px] h-[50px] bg-white">
      <button (click)="goBack()" class="w-[32px] h-[32px] flex items-center justify-center">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M18.8 9.79999H0.800049" stroke="#363431" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M9.80005 18.8L0.800049 9.79999L9.80005 0.799988" stroke="#363431" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <span style="font-size:16px; font-weight:600; color:#363431; letter-spacing:1px; line-height:100%;">Cart</span>
      <button class="relative w-[32px] h-[32px] flex items-center justify-center">
        <svg width="23" height="20" viewBox="0 0 23 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="8.07267" cy="17.9428" rx="0.909091" ry="0.857143" stroke="#363431" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
          <ellipse cx="18.0727" cy="17.9428" rx="0.909091" ry="0.857143" stroke="#363431" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M0.800049 0.799988H4.43641L6.87278 12.2771C7.04436 13.0916 7.8104 13.673 8.69096 13.6571H17.5273C18.4079 13.673 19.1739 13.0916 19.3455 12.2771L20.8 5.0857H5.3455" stroke="#363431" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="19.8" cy="3.79999" r="3" fill="#E90101" />
        </svg>
        @if (totalItems > 0) {
        <span class="absolute -top-[2px] -right-[2px] w-[14px] h-[14px] rounded-full bg-red-500 text-white text-[8px] font-bold flex items-center justify-center">
          {{ totalItems }}
        </span>
        }
      </button>
    </div>

    <!-- Cart item list -->
    <div class="flex flex-col bg-white">
      @for (item of items; track item.id) {

      <!-- Swipeable row wrapper -->
      <div class="relative overflow-hidden" style="height: 111px;">

        <!-- Delete reveal panel (behind the card) -->
        <div class="absolute right-0 top-0 bottom-0 w-[90px] bg-[#F5F5F5] flex flex-col items-center justify-center gap-[8px] rounded-r-[8px]" (click)="removeItem(item.id)">
          <svg width="18" height="19" viewBox="0 0 18 19" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M0.800049 4.15725H2.57783H16.8" stroke="#E90101" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
            <path
              d="M15.8218 4.15742C15.8218 3.71559 15.4637 3.35742 15.0218 3.35742C14.58 3.35742 14.2218 3.71559 14.2218 4.15742H15.0218H15.8218ZM3.37739 4.15742C3.37739 3.71559 3.01922 3.35742 2.57739 3.35742C2.13556 3.35742 1.77739 3.71559 1.77739 4.15742H2.57739H3.37739ZM4.44341 4.15798C4.44341 4.59981 4.80158 4.95798 5.24341 4.95798C5.68524 4.95798 6.04341 4.59981 6.04341 4.15798H5.24341H4.44341ZM11.5545 4.15798C11.5545 4.59981 11.9127 4.95798 12.3545 4.95798C12.7963 4.95798 13.1545 4.59981 13.1545 4.15798H12.3545H11.5545ZM15.0218 4.15742H14.2218V15.9104H15.0218H15.8218V4.15742H15.0218ZM15.0218 15.9104H14.2218C14.2218 16.3533 13.8278 16.7894 13.2441 16.7894V17.5894V18.3894C14.624 18.3894 15.8218 17.3219 15.8218 15.9104H15.0218ZM13.2441 17.5894V16.7894H4.35517V17.5894V18.3894H13.2441V17.5894ZM4.35517 17.5894V16.7894C3.77145 16.7894 3.37739 16.3533 3.37739 15.9104H2.57739H1.77739C1.77739 17.3219 2.97521 18.3894 4.35517 18.3894V17.5894ZM2.57739 15.9104H3.37739V4.15742H2.57739H1.77739V15.9104H2.57739ZM5.24341 4.15798H6.04341V2.47899H5.24341H4.44341V4.15798H5.24341ZM5.24341 2.47899H6.04341C6.04341 2.03601 6.43747 1.6 7.02119 1.6V0.799999V-7.7486e-07C5.64123 -7.7486e-07 4.44341 1.06741 4.44341 2.47899H5.24341ZM7.02119 0.799999V1.6H10.5767V0.799999V-7.7486e-07H7.02119V0.799999ZM10.5767 0.799999V1.6C11.1605 1.6 11.5545 2.03601 11.5545 2.47899H12.3545H13.1545C13.1545 1.06741 11.9567 -7.7486e-07 10.5767 -7.7486e-07V0.799999ZM12.3545 2.47899H11.5545V4.15798H12.3545H13.1545V2.47899H12.3545Z"
              fill="#E90101" />
            <path d="M7.02184 8.35469V13.3917" stroke="#E90101" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M10.5785 8.35469V13.3917" stroke="#E90101" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span class="text-[12px] font-semibold text-[#E53935]">Remove</span>
        </div>

        <!-- Cart item card -->
        <div class="absolute inset-0 bg-white border-b border-[#F0F0F0] flex items-center" style="padding: 7px 10px; gap: 10px; transition: transform 0.2s ease;" [style.transform]="'translateX(' + item.swipeOffset + 'px)'" (touchstart)="onSwipeStart(item, $event)" (touchmove)="onSwipeMove(item, $event)" (touchend)="onSwipeEnd(item)">

          <!-- Product image -->
          <div class="flex-shrink-0 rounded-[12px] overflow-hidden bg-[#F5F5F5] flex items-center justify-center" style="width: 90px; height: 90px;">
            <img [src]="item.image" [alt]="item.name" class="w-full h-full object-contain" />
          </div>

          <!-- Details -->
          <div class="flex-1 flex flex-col justify-between h-full py-[2px]">
            <div class="flex items-start justify-between">
              <div class="flex flex-col gap-[2px]">
                <span style="font-family:'Plus Jakarta Sans',sans-serif; font-size:14px; font-weight:500; line-height:20px; color:#363431;">{{ item.name }}</span>
                <div class="flex items-center gap-[4px]">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="#F59E0B">
                    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
                  </svg>
                  <span class="text-[11px] text-[#9CA3AF]">({{ item.reviews }} reviews)</span>
                </div>
                <span style="font-family:'Plus Jakarta Sans',sans-serif; font-size:14px; font-weight:500; line-height:20px; color:#3E63DD;">${{ item.price }}.00</span>
              </div>
              <!-- Heart -->
              <button (click)="toggleWishlist(item)" class="w-[28px] h-[28px] flex items-center justify-center mt-[2px]">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <rect x="0.5" y="0.5" width="19" height="19" rx="9.5" fill="white" />
                  <rect x="0.5" y="0.5" width="19" height="19" rx="9.5" stroke="#DADADA" />
                  <path fill-rule="evenodd" clip-rule="evenodd" d="M4.67517 9.76569C4.04926 7.81152 4.78076 5.57794 6.83234 4.91702C7.91151 4.56877 9.10267 4.7741 9.99984 5.44902C10.8486 4.79277 12.0835 4.5711 13.1615 4.91702C15.2131 5.57794 15.9493 7.81152 15.3239 9.76569C14.3498 12.8632 9.99984 15.249 9.99984 15.249C9.99984 15.249 5.68201 12.8994 4.67517 9.76569Z" stroke="#464646" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                  <path d="M12.3333 6.90833C12.9574 7.11016 13.3984 7.66724 13.4515 8.32116" stroke="#464646" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </button>
            </div>

            <!-- Quantity stepper -->
            <div class="flex justify-end">
              <div class="flex items-center gap-[8px] bg-[#F5F5F5] rounded-full px-[10px] py-[4px]">
                <button (click)="decrement(item)" class="w-[20px] h-[20px] flex items-center justify-center text-[#1A1C1E] text-[18px] font-light leading-none">−</button>
                <span class="text-[13px] font-semibold text-[#1A1C1E] w-[16px] text-center">{{ item.quantity }}</span>
                <button (click)="increment(item)" class="w-[20px] h-[20px] flex items-center justify-center text-[#5732EE] text-[18px] font-light leading-none">+</button>
              </div>
            </div>
          </div>

        </div>
      </div>
      }
    </div>

    <!-- Subtotal + Delivery + Checkout (scrollable) -->
    <div class="bg-white mt-[8px]" style="border-top: 1px solid #F0F0F0;">
      <div class="flex items-center justify-between px-[20px] py-[10px]">
        <span class="text-[14px] text-[#1A1C1E]">Subtotal</span>
        <span class="text-[14px] font-semibold text-[#1A1C1E]">₹{{ subtotal | number:'1.2-2' }}</span>
      </div>
      <div class="h-[1px] bg-[#F0F0F0] mx-[20px]"></div>
      <div class="flex items-center justify-between px-[20px] py-[10px]">
        <span class="text-[14px] font-medium text-[#1A1C1E]">Total Delivery Charges</span>
        <span class="text-[14px] font-bold text-[#22C55E]">FREE</span>
      </div>
      <div class="flex justify-center py-[16px]">
        <button (click)="checkout()"
                class="text-white text-[16px] font-semibold flex items-center justify-center"
                style="width:327px; height:48px; border-radius:24px;
                       background: linear-gradient(90deg, #5B51E8 0%, #3E63DD 50%, #795BF1 100%);">
          Checkout
        </button>
      </div>
    </div>

  </div>

  <!-- Bottom nav -->
  <app-bottom-nav></app-bottom-nav>

</div>

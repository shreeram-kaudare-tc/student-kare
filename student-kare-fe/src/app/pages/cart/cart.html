<div class="relative w-full h-[100dvh] bg-white flex flex-col overflow-hidden font-jakarta">

  <!-- Gradient Header Block -->
  <div class="w-full rounded-b-[40px] pt-px pb-px gap-[10px] flex flex-col justify-center min-h-[90px] max-h-[100px]" style="background: linear-gradient(104.94deg, #3E63DD 3.61%, #9A84F5 80.46%);">
    <!-- Search Bar -->
    <div class="px-[20px] pt-[10px]">
      <div class="flex items-center gap-[10px]">
        <div class="flex items-center gap-[10px] rounded-xl h-[44px] px-[16px] flex-1" style="background: rgba(255, 255, 255, 1)">
          <input type="text" placeholder="Search for groceries and more" class="flex-1 bg-transparent text-[13px] text-[#1A1C1E] placeholder-[#C4C8D4] font-normal outline-none border-none" />
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1C1E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
        </div>
        <div class="flex items-center gap-[8px] flex-shrink-0">
          <button class="w-[26px] h-[26px] flex items-center justify-center">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <!-- Top folding flap -->
              <path d="M10 4H18C20.2091 4 22 5.79086 22 8V16.5" stroke="white" stroke-width="2.2" stroke-linecap="round" />
              <!-- Wallet main body -->
              <rect x="2" y="8" width="17" height="13" rx="3" fill="white" />
              <!-- Snap button (cutout behavior) -->
              <circle cx="15.5" cy="14.5" r="1.8" fill="#795BF1" />
            </svg>
          </button>
          <div class="w-[26px] h-[26px] rounded-full flex items-center justify-center">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M14 8C14 9.06087 13.5786 10.0783 12.8284 10.8284C12.0783 11.5786 11.0609 12 10 12C8.93913 12 7.92172 11.5786 7.17157 10.8284C6.42143 10.0783 6 9.06087 6 8C6 6.93913 6.42143 5.92172 7.17157 5.17157C7.92172 4.42143 8.93913 4 10 4C11.0609 4 12.0783 4.42143 12.8284 5.17157C13.5786 5.92172 14 6.93913 14 8Z" fill="white" />
              <path fill-rule="evenodd" clip-rule="evenodd" d="M9.592 19.992C4.2585 19.778 0 15.386 0 10C0 4.477 4.477 0 10 0C15.523 0 20 4.477 20 10C20 15.523 15.523 20 10 20H9.863C9.77233 20 9.682 19.9973 9.592 19.992ZM3.583 16.31C3.50823 16.0953 3.48278 15.8665 3.50854 15.6406C3.5343 15.4147 3.6106 15.1975 3.73179 15.0051C3.85298 14.8128 4.01593 14.6502 4.20856 14.5294C4.40119 14.4086 4.61855 14.3328 4.8445 14.3075C8.7425 13.876 11.2815 13.915 15.1605 14.3165C15.3868 14.3401 15.6046 14.4149 15.7976 14.5354C15.9905 14.6559 16.1534 14.8189 16.2739 15.0119C16.3943 15.2048 16.4691 15.4227 16.4927 15.649C16.5162 15.8753 16.4877 16.1039 16.4095 16.3175C18.0721 14.6355 19.0031 12.365 19 10C19 5.0295 14.9705 1 10 1C5.0295 1 1 5.0295 1 10C1 12.458 1.9855 14.686 3.583 16.31Z" fill="white" />
            </svg>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Cart Title Bar -->
  <div class="w-full flex items-center justify-between px-[20px] bg-white" style="height: 50px;">
    <button (click)="goBack()" class="w-[32px] h-[32px] flex items-center justify-center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#363431" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7" />
      </svg>
    </button>
    <span class="text-[16px] font-semibold text-[#363431]">Cart</span>
    <div class="relative flex items-center justify-center w-[32px] h-[32px]">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#363431" stroke-width="2">
        <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6" />
        <circle cx="9" cy="21" r="1" />
        <circle cx="20" cy="21" r="1" />
      </svg>
      @if (totalItems > 0) {
        <div class="absolute top-[6px] right-[2px] w-[6px] h-[6px] bg-[#E90101] rounded-full"></div>
      }
    </div>
  </div>

  <!-- Scrollable Content -->
  <div class="flex-1 overflow-y-auto pb-[72px] scrollbar-hide">

    <!-- Product List -->
    <div class="flex flex-col bg-white">
      @for (item of items; track item.id) {
      <div class="relative overflow-hidden w-full" style="height: 111px;">

        <!-- Swipe Delete Reveal -->
        <div class="absolute right-0 top-0 bottom-0 bg-[#FBE9E9] flex flex-col items-center justify-center gap-[4px] px-[20px]" (click)="removeItem(item.id)">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 10V18C6 19.6569 7.34315 21 9 21H15C16.6569 21 18 19.6569 18 18V10" stroke="#FF0000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M4 7H20" stroke="#FF0000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M9 7V4.5C9 3.67157 9.67157 3 10.5 3H13.5C14.3284 3 15 3.67157 15 4.5V7" stroke="#FF0000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M10 12V18M14 12V18" stroke="#FF0000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span class="text-[10px] font-bold text-[#E90101]">Remove</span>
        </div>

        <!-- Card Body (Slideable) -->
        <div class="absolute inset-0 bg-white flex items-center px-[10px] gap-[12px] transition-transform duration-200" [style.transform]="'translateX(' + item.swipeOffset + 'px)'" (touchstart)="onSwipeStart(item, $event)" (touchmove)="onSwipeMove(item, $event)" (touchend)="onSwipeEnd(item)">

          <div class="w-[84px] h-[91px] bg-[#F5F5F5] rounded-[12px] flex items-center justify-center overflow-hidden flex-shrink-0">
            <img [src]="item.image" [alt]="item.name" class="w-full h-full object-cover" />
          </div>

          <div class="flex-1 flex flex-col gap-[8px] py-[2px]">
            <div class="flex flex-col gap-[2px]">
              <div class="flex items-start justify-between pr-[10px]">
                <span class="text-[14px] font-medium text-[#363431] leading-[20px] max-w-[139px] line-clamp-1">{{ item.name }}</span>
                <button (click)="toggleWishlist(item); $event.stopPropagation()" class="opacity-40">
                  <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="0.5" y="0.5" width="19" height="19" rx="9.5" fill="white" />
                    <rect x="0.5" y="0.5" width="19" height="19" rx="9.5" stroke="#DADADA" />
                    <path fill-rule="evenodd" clip-rule="evenodd" d="M4.67517 9.76569C4.04926 7.81152 4.78076 5.57794 6.83234 4.91702C7.91151 4.56877 9.10267 4.7741 9.99984 5.44902C10.8486 4.79277 12.0835 4.5711 13.1615 4.91702C15.2131 5.57794 15.9493 7.81152 15.3239 9.76569C14.3498 12.8632 9.99984 15.249 9.99984 15.249C9.99984 15.249 5.68201 12.8994 4.67517 9.76569Z" stroke="#464646" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M12.3333 6.90834C12.9574 7.11017 13.3984 7.66726 13.4515 8.32117" stroke="#464646" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                  </svg>
                </button>
              </div>
              <div class="flex items-center gap-[4px] h-[14px]">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="#F59E0B">
                  <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
                </svg>
                <span class="text-[11px] text-[#A3ADC2] font-medium leading-[14px]">({{ item.reviews }} reviews)</span>
              </div>
            </div>
            
            <div class="flex items-center justify-between">
              <span class="text-[14px] font-medium text-[#3E63DD] leading-[20px]">${{ item.price }}.00</span>
              <div class="flex items-center w-[74px] h-[20px] bg-white border border-[#DADADA] rounded-[70px] overflow-hidden mr-[10px]">
                <button (click)="decrement(item); $event.stopPropagation()" class="flex items-center justify-center w-[26px] h-full bg-[#F8F8F8] text-[#363431] transition-colors hover:bg-[#F2F2F2]">
                  <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                  </svg>
                </button>
                <span class="flex-1 text-[11px] font-bold text-[#363431] text-center leading-none">{{ item.quantity }}</span>
                <button (click)="increment(item); $event.stopPropagation()" class="flex items-center justify-center w-[26px] h-full bg-[#F8F8F8] text-[#363431] transition-colors hover:bg-[#F2F2F2]">
                  <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
      }
    </div>

    <!-- Summary Section -->
    <div class="px-[20px] pt-[15px]">
      <div class="flex flex-col gap-[12px]">
        <div class="flex items-center justify-between py-[4px]">
          <span class="text-[14px] text-[#313131] font-medium leading-[20px]">Subtotal</span>
          <span class="text-[14px] text-[#313131] font-medium leading-[20px]">₹{{ subtotal | number:'1.2-2' }}</span>
        </div>

        <!-- Solid Divider -->
        <div class="border-t border-[#D0D0D0]"></div>

        <div class="flex items-center justify-between py-[4px]">
          <span class="text-[12px] text-[#222222] font-semibold leading-tight tracking-[0.15px]">Total Delivery Charges</span>
          <span class="text-[12px] font-bold text-[#22C55E] leading-tight">FREE</span>
        </div>

        <!-- Custom High-Fidelity Dashed Divider -->
        <div class="h-[1.5px] w-full" style="background-image: linear-gradient(to right, #363431 75%, transparent 75%); background-size: 16px 1.5px; background-repeat: repeat-x;"></div>

        <div class="flex items-center justify-between mt-[4px]">
          <span class="text-[15px] text-[#313131] font-bold leading-[20px]">Total Payable Amount:</span>
          <span class="text-[15px] text-[#3E63DD] font-bold leading-[20px]">₹{{ subtotal | number:'1.2-2' }}</span>
        </div>
        
      </div>
    </div>

    <!-- Checkout Button -->
    <div class="px-[20px] pt-[10px] pb-[20px]">
      <button (click)="checkout()" class="w-full active:scale-95 transition-transform flex items-center justify-center text-white text-[16px] font-bold" style="height: 50px; border-radius: 28px; background: linear-gradient(to right, rgba(91, 81, 232, 1), rgba(62, 99, 221, 1), rgba(121, 91, 241, 1)); box-shadow: 0px 4px 15px rgba(62, 99, 221, 0.35);">
        Checkout
      </button>
    </div>

  </div>

  <!-- Bottom Navigation -->
  <app-bottom-nav></app-bottom-nav>

</div>

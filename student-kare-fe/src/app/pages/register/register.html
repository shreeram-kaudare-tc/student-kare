<app-auth-layout1>

    <!-- Content -->
    <div class="w-full min-w-full h-[100dvh] overflow-y-auto relative flex flex-col pt-[24px]">

        <!-- Header Area (with bottom margin to separate from the white card) -->
        <div class="flex flex-col gap-[20px] mb-[12px]">
            <!-- Back Button -->
            <p (click)="goBack()" class="cursor-pointer px-4">
                <img class="h-[8px] w-[14px]" src="/images/login/back-arrow.png" alt="Back">
            </p>

            <!-- Title -->
            <div class="flex flex-col px-4 gap-[8px]">
                <h1 class=" text-[32px] font-bold leading-[130%] tracking-[-0.02em] text-[#5732EE] align-middle">Register</h1>
                <p class="text-[12px] leading-[16.8px] text-[#6C7278] font-medium tracking-[-0.01em]">Already have an account?<a (click)="goToLogin()" class="text-[#3E63DD] font-semibold hover:underline cursor-pointer"> Log In </a></p>
            </div>
        </div>

        <!-- Form Card (flex-1 makes it push to the very bottom, creating the solid white area) -->
        <div class="bg-white flex-1 w-full flex flex-col p-[20px] pb-[32px] gap-[14px]">

            <!-- First Name + Last Name -->
            <div class="flex gap-[12px]">
                <div class="flex flex-col gap-[6px] flex-1">
                    <label class="text-[12px] font-normal leading-[18px] text-[#8F99B3]">First Name</label>
                    <app-input-field type="text" placeholder="Lois" [(ngModel)]="firstName" class="w-full">
                    </app-input-field>
                </div>
                <div class="flex flex-col gap-[6px] flex-1">
                    <label class="text-[12px] font-normal leading-[18px] text-[#8F99B3]">Last Name</label>
                    <app-input-field type="text" placeholder="Becket" [(ngModel)]="lastName" class="w-full">
                    </app-input-field>
                </div>
            </div>

            <!-- Email -->
            <div class="flex flex-col gap-[6px]">
                <label class="text-[12px] font-normal leading-[18px] text-[#8F99B3]">Email</label>
                <app-input-field type="email" placeholder="Loisbecket@gmail.com" [(ngModel)]="email" class="w-full">
                </app-input-field>
            </div>

            <div class="flex flex-col gap-[6px]">
                <label class="text-[12px] font-normal leading-[18px] text-[#8F99B3]">Birth of date</label>
                <div class="relative flex items-center" (click)="birthDateInput.showPicker()">
                    <input #birthDateInput type="date" [(ngModel)]="birthDate" placeholder="18/03/2024" class="w-full h-[52px] border border-[#E9EAF2] rounded-[14px] pl-[16px] pr-[48px] text-[14px] text-[#1A1C1E] bg-white focus:outline-none focus:ring-2 focus:ring-[#3E63DD]/30 placeholder:text-[#C4C8D4]" />
                    <span class="absolute right-[14px] text-[#9BA4B5] cursor-pointer">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                            <line x1="16" y1="2" x2="16" y2="6" />
                            <line x1="8" y1="2" x2="8" y2="6" />
                            <line x1="3" y1="10" x2="21" y2="10" />
                        </svg>
                    </span>
                </div>
            </div>

            <!-- Phone Number -->
            <div class="flex flex-col gap-[6px]">
                <label class="text-[12px] font-normal leading-[18px] text-[#8F99B3]">Phone Number</label>
                <div class="flex items-center h-[52px] border border-[#E9EAF2] rounded-[14px] bg-white px-[14px] gap-[10px]">
                    <!-- Flag + Dropdown -->
                    <div class="flex items-center gap-[7px] pr-[10px] border-r border-[#EDF1F3] flex-shrink-0">
                        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg" class="rounded-full shadow-sm flex-shrink-0">
                            <mask id="flag-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="18" height="18">
                                <circle cx="9" cy="9" r="9" fill="white"/>
                            </mask>
                            <g mask="url(#flag-mask)">
                                <rect width="18" height="6" fill="#FF9933"/>
                                <rect y="6" width="18" height="6" fill="#FFFFFF"/>
                                <rect y="12" width="18" height="6" fill="#138808"/>
                                <circle cx="9" cy="9" r="2.2" fill="none" stroke="#000080" stroke-width="0.7"/>
                                <circle cx="9" cy="9" r="0.6" fill="#000080"/>
                            </g>
                        </svg>
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#9BA4B5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="6 9 12 15 18 9" />
                        </svg>
                    </div>
                    <!-- Phone Input -->
                    <input type="tel" [(ngModel)]="phoneNumber" placeholder="(454) 726-0592" class="flex-1 text-[14px] text-[#1A1C1E] bg-transparent focus:outline-none placeholder:text-[#C4C8D4]" />
                </div>
            </div>

            <!-- Set Password -->
            <div class="flex flex-col gap-[6px]">
                <label class="text-[12px] font-normal leading-[18px] text-[#8F99B3]">Set Password</label>
                <div class="relative flex items-center">
                    <app-input-field type="password" placeholder="••••••••" [(ngModel)]="password" class="w-full">
                    </app-input-field>
                </div>
            </div>

            <!-- Register Button -->
            <div class="mt-4 flex flex-col gap-[20px]">
                <app-button variant="primary" [fullWidth]="true" (click)="register()">Register</app-button>

                <!-- Already have account -->
                <p class="text-[12px] leading-[16.8px] text-[#6C7278] text-center font-medium tracking-[-0.01em]">
                    Already have an account?
                    <span (click)="goToLogin()" class="text-[#3E63DD] font-semibold cursor-pointer hover:underline">Log In</span>
                </p>
            </div>

        </div>
    </div>
</app-auth-layout1>

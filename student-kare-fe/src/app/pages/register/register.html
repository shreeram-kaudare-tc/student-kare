<div class="relative w-full h-[100dvh] overflow-hidden font-jakarta">

    <!-- Fixed Blur BG — uses radial-gradient for iOS Safari compatibility -->
    <div class="fixed inset-0 z-0 pointer-events-none auth-gradient-bg"></div>

    <!-- Scrollable Content -->
    <div class="relative z-10 h-full overflow-y-auto flex flex-col gap-[24px]">

        <!-- Header Area with BG visible -->
        <div class="flex flex-col flex-shrink-0 gap-[24px] pt-[68px] pl-[24px]">
            <!-- Back Button -->
            <svg (click)="goBack()" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M5 12H19M5 12L9 16M5 12L9 8" stroke="#464646" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <!-- Title -->
            <div class="flex flex-col gap-[12px]">
                <h1 class="font-['Inter'] text-[32px] font-bold leading-[130%] tracking-[-0.02em] text-[#5732EE]">Register</h1>
                <p class="flex items-center w-[327px] h-[17px] gap-[6px] font-['Inter'] font-medium text-[12px] leading-[140%] tracking-[-0.01em] text-[#464646]">
                    Already have an account?
                    <a (click)="goToLogin()" class="cursor-pointer underline font-['Inter'] font-semibold text-[12px] leading-[140%] tracking-[-0.01em] text-[#4D81E7]">Log In</a>
                </p>
            </div>
        </div>

        <!-- Form Card (white area) -->
        <div class="bg-white flex-1 w-full flex flex-col p-[20px] pb-[32px] gap-[32px] ">

            <div class="flex flex-col gap-[16px]">
                <!-- First Name + Last Name -->
                <div class="flex gap-[16px]">
                    <div class="flex flex-col gap-[2px] flex-1">
                        <label class="font-['Plus_Jakarta_Sans'] font-medium text-[12px] leading-[160%] tracking-[-0.02em] text-[#6C7278]">First Name</label>
                        <app-input-field type="text" placeholder="Enter First Name" [(ngModel)]="firstName" class="w-full">
                        </app-input-field>
                    </div>
                    <div class="flex flex-col gap-[2px] flex-1">
                        <label class="font-['Plus_Jakarta_Sans'] font-medium text-[12px] leading-[160%] tracking-[-0.02em] text-[#6C7278]">Last Name</label>
                        <app-input-field type="text" placeholder="Enter Last Name" [(ngModel)]="lastName" class="w-full">
                        </app-input-field>
                    </div>
                </div>

                <!-- Email -->
                <div class="flex flex-col gap-[2px]">
                    <label class="font-['Plus_Jakarta_Sans'] font-medium text-[12px] leading-[160%] tracking-[-0.02em] text-[#6C7278]">Email</label>
                    <app-input-field type="email" placeholder="Enter Email" [(ngModel)]="email" class="w-full">
                    </app-input-field>
                </div>

                <!-- Birth of date -->
                <div class="flex flex-col gap-[2px]">
                    <label class="font-['Plus_Jakarta_Sans'] font-medium text-[12px] leading-[160%] tracking-[-0.02em] text-[#6C7278]">Birth of date</label>
                    <div class="flex items-center w-full h-[46px] bg-white border border-[#EDF1F3] rounded-[10px] px-[14px] gap-[10px] shadow-[0px_1px_2px_0px_rgba(228,229,231,0.24)]" (click)="birthDateInput.showPicker()">
                        <input #birthDateInput type="date" [(ngModel)]="birthDate"
                            class="flex-1 font-['Inter'] font-medium text-[14px] leading-[140%] tracking-[-0.01em] text-[#1A1C1E] bg-transparent focus:outline-none placeholder:text-[#C4C8D4] [color-scheme:light]" />
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" class="flex-shrink-0 cursor-pointer">
                            <path d="M10.6667 2V4.66667M5.33332 2V4.66667M2.66666 7.33333H13.3333M2.66666 4.66667C2.66666 4.31304 2.80713 3.97391 3.05718 3.72386C3.30723 3.47381 3.64637 3.33333 3.99999 3.33333H12C12.3536 3.33333 12.6928 3.47381 12.9428 3.72386C13.1928 3.97391 13.3333 4.31304 13.3333 4.66667V12.6667C13.3333 13.0203 13.1928 13.3594 12.9428 13.6095C12.6928 13.8595 12.3536 14 12 14H3.99999C3.64637 14 3.30723 13.8595 3.05718 13.6095C2.80713 13.3594 2.66666 13.0203 2.66666 12.6667V4.66667ZM7.33332 10.6667C7.33332 10.8435 7.40356 11.013 7.52859 11.1381C7.65361 11.2631 7.82318 11.3333 7.99999 11.3333C8.1768 11.3333 8.34637 11.2631 8.47139 11.1381C8.59642 11.013 8.66666 10.8435 8.66666 10.6667C8.66666 10.4899 8.59642 10.3203 8.47139 10.1953C8.34637 10.0702 8.1768 10 7.99999 10C7.82318 10 7.65361 10.0702 7.52859 10.1953C7.40356 10.3203 7.33332 10.4899 7.33332 10.6667Z" stroke="#ACB5BB" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </div>
                </div>

                <!-- Phone Number -->
                <div class="flex flex-col gap-[2px]">
                    <label class="font-['Plus_Jakarta_Sans'] font-medium text-[12px] leading-[160%] tracking-[-0.02em] text-[#6C7278]"> Phone Number</label>
                    <div class="flex items-center  h-[46px] border border-[#EDF1F3] rounded-[10px] bg-white px-[14px] gap-[10px] shadow-[0px_1px_2px_0px_rgba(228,229,231,0.24)]">
                        <!-- Flag + Dropdown -->
                        <div class="flex items-center w-[62px] h-[48px] gap-[7px] pr-[10px] border-r border-[#EDF1F3] flex-shrink-0">
                            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <g clip-path="url(#clip0_882_762)">
                                    <circle cx="9" cy="8.99999" r="9" fill="#EEEEEE" />

                                        d="M10.125 0.069614C9.76219 0.0243717 9.39267 0.000726289 9.01777 1.51317e-06L8.98223 1.51472e-06C8.60733 0.000726324 8.23781 0.0243717 7.875 0.0696141L7.875 7.875L0.0696279 7.875C0.0236726 8.24354 -4.10056e-07 8.619 -3.93402e-07 8.99998C-3.76749e-07 9.38098 0.0236741 9.75645 0.0696323 10.125L7.875 10.125L7.875 17.9304C8.24354 17.9763 8.61901 18 9 18C9.38099 18 9.75646 17.9763 10.125 17.9304L10.125 10.125L17.9304 10.125C17.9763 9.75645 18 9.38098 18 8.99998C18 8.619 17.9763 8.24354 17.9304 7.875L10.125 7.875L10.125 0.069614Z"

                                        fill="#FFDA44" />
                                </g>
                                <defs>
                                    <clipPath id="clip0_882_762">
                                        <rect width="18" height="18" fill="white" />
                                    </clipPath>
                                </defs>
                            </svg>
                            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M9.95998 4.475L6.69998 7.735C6.31498 8.12 5.68498 8.12 5.29998 7.735L2.03998 4.475" stroke="#6C7278" stroke-width="1.3" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                        </div>
                        <!-- Phone Input -->
                        <input type="tel" [(ngModel)]="phoneNumber" placeholder="Enter Phone Number" class="flex-1 font-['Inter'] font-medium text-[14px] leading-[140%] tracking-[-0.01em] text-[#1A1C1E] bg-transparent focus:outline-none placeholder:text-[#C4C8D4]" />
                    </div>
                </div>

                <!-- Set Password -->
                <div class="flex flex-col gap-[2px]">
                    <label class="font-['Plus_Jakarta_Sans'] font-medium text-[12px] leading-[160%] tracking-[-0.02em] text-[#6C7278]">Set Password</label>
                    <app-input-field type="password" placeholder="Enter Password" [(ngModel)]="password" class="w-full"></app-input-field>
                </div>
            </div>

            <!-- Register Button -->
            <div class="flex flex-col justify-center px-4 items-center gap-[7px]">
                <div class="w-full">
                    <app-button variant="primary" [fullWidth]="true" (click)="register()">Register</app-button>
                </div>
                <!-- Already have account -->
                <p class="flex items-center justify-center gap-[4px] font-['Inter'] font-medium text-[12px] leading-[140%] tracking-[-0.01em] text-[#6C7278]">
                    Already have an account?
                    <span (click)="goToLogin()" class="font-['Inter'] font-semibold text-[12px] leading-[140%] tracking-[-0.01em] text-[#4D81E7] cursor-pointer">Log In</span>
                </p>
            </div>

        </div>
    </div>

</div>

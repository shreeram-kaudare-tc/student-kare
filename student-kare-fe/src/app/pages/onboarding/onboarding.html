<div class="relative w-full h-screen bg-white flex flex-col overflow-hidden font-jakarta">

    <!-- Slides Wrapper -->
    <div class="flex-1 flex flex-col overflow-hidden">
        @for (slide of slides; track slide.title; let i = $index) {
        @if (i === currentIndex) {
        <div class="flex flex-col h-full slide-enter">

            <!-- Illustration Area with SVG Background -->
            <div class="relative flex-1 flex items-center justify-center overflow-hidden">
                <!-- SVG Background -->
                <img [src]="slide.bgSvg" alt="" class="absolute inset-0 w-full h-full object-cover object-center" />
                <!-- Illustration Image -->
                <img [src]="slide.image" [alt]="slide.title" class="relative z-10 w-[65vw] max-w-[280px] h-auto object-contain" />
            </div>

            <!-- Bottom Content -->
            <div class="w-[273px] mx-auto flex flex-col items-center gap-[25px] pb-[42px] z-10">

                <!-- Text Block -->
                <div class="flex flex-col items-center gap-[8px] w-full text-center">
                    <h2 class="text-[18px] font-medium text-[#5E4DB2] leading-none">
                        {{ slide.title }}
                    </h2>
                    <p class="text-[12px] font-normal leading-[21px] text-[#000000]">
                        {{ slide.description }}
                    </p>
                </div>

                <!-- Dot Indicators -->
                <div class="flex items-center gap-[8px]">
                    @for (dot of slides; track dot.title; let j = $index) {
                    <button (click)="goToSlide(j)" [class]="j === currentIndex
                                        ? 'h-[6px] w-[24px] rounded-full bg-[#5732EE] transition-all duration-300'
                                        : 'h-[6px] w-[6px] rounded-full bg-[#5732EE]/20 transition-all duration-300'">
                    </button>
                    }
                </div>

                <!-- Next Button -->
                <button (click)="next()" class="w-full h-[48px] rounded-full bg-[#3E63DD] text-white text-[14px] font-semibold hover:bg-[#2d52cc] active:scale-95 transition-all duration-200 cursor-pointer">
                    Next
                </button>

            </div>
        </div>
        }
        }
    </div>

</div>

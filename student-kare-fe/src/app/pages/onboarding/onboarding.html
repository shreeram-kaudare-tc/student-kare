<div class="onboarding-page">
  <div class="onboarding-frame">
    @for (slide of slides; track slide.title; let i = $index) { @if (i === currentIndex) {
    <div class="onboarding-slide slide-enter">
      <div class="hero-section">
        <img [src]="slide.bgSvg" alt="" class="hero-bg" />
        <img [src]="slide.image" [alt]="slide.title" class="hero-image" />
      </div>

      <div class="content-section">
        <div class="text-block">
          <h2>{{ slide.title }}</h2>
          <p>{{ slide.description }}</p>
        </div>

        <div class="action-block">
          <div class="dots-wrap">
            @for (dot of slides; track dot.title; let j = $index) {
            <button
              (click)="goToSlide(j)"
              [class.active-dot]="j === currentIndex"
              [class.inactive-dot]="j !== currentIndex">
            </button>
            }
          </div>

          <button (click)="next()" class="next-btn btn-primary-gradient">Next</button>
        </div>
      </div>
    </div>
    } }
  </div>
</div>

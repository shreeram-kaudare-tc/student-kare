<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>StudentKareFe</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
  <script>
    // Prevent iOS Safari pinch-to-zoom
    document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
    document.addEventListener('gesturechange', function(e) { e.preventDefault(); });
    document.addEventListener('gestureend', function(e) { e.preventDefault(); });
    // Prevent double-tap zoom on iOS
    document.addEventListener('touchend', function(e) {
      if (e.timeStamp - (window._lastTap || 0) < 300) { e.preventDefault(); }
      window._lastTap = e.timeStamp;
    }, { passive: false });
  </script>
</body>
</html>
